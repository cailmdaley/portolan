<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexarchy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Local EB Garamond with full OpenType features (smcp, pcap) -->
    <style>
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Italic.otf') format('opentype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-SemiBold.otf') format('opentype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- JetBrains Mono from Google Fonts (no special features needed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-latex.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --font-main: 'EB Garamond', Garamond, serif;
        --font-mono: 'JetBrains Mono', monospace;
        --bg-primary: #C8B8A8;
        --bg-card: #EDE8E0;
        --bg-elevated: #FDFCFA;
        --text-primary: #2E2A26;
        --text-secondary: #4A4540;
        --text-muted: #7A7368;
        --border: #A89888;
        --border-light: #C8BBA8;
        --accent: #5A7B7B;
        --gold: #9A7B35;
        --gold-light: #C4A86A;
        --green: #6B8B6B;
        --red: #A87070;

        /* Worn Ledger — Warm aged paper palette */
        --parchment-base: #D8CBBA;       /* deep warm parchment */
        --parchment-light: #E5D9C8;      /* lighter areas */
        --parchment-dark: #C9BAA5;       /* shadowed paper */
        --parchment-edge: #BBA890;       /* worn edges */
        --ink-dark: #2A2520;             /* deep ink for headings */
        --ink-body: #3D3630;             /* body text */
        --ink-light: #5A524A;            /* secondary text */
        --ink-faded: #7A7068;            /* muted/timestamps */
        --sepia-accent: #8A6B2A;         /* warm gold-brown accent */
        --sepia-muted: #A08858;          /* softer accent */
        --verdigris: #4A6258;            /* aged copper-green */
        --rust: #8A5548;                 /* attention/errors */
        --ui-dark: var(--parchment-base);
        --ui-dark-elevated: var(--parchment-light);
        --ui-dark-surface: var(--parchment-dark);
        --ui-border: #B8A890;
        --ui-border-light: #C8B8A0;
        --ui-gold: var(--sepia-accent);
        --ui-gold-muted: var(--sepia-muted);
        --ui-text: var(--ink-body);
        --ui-text-secondary: var(--ink-light);
        --ui-text-muted: var(--ink-faded);
        --ui-accent: var(--verdigris);
        --ui-green: #5A6B50;
        --ui-red: var(--rust);
        --ui-purple: #6A5868;
        --ui-teal: var(--verdigris);

        /* Custom cursor - the swallow for the whole map, beak tip is hotspot */
        --cursor-bird: url('/cursors/bird-small.png') 1 2, default;
      }
      body {
        overflow: hidden;
        background: var(--bg-primary);
        font-family: var(--font-main);
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ═══════════════════════════════════════════════════════════
         CSS2D LABELS — HTML overlays for proper OpenType features
         ═══════════════════════════════════════════════════════════ */

      .label-container {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .city-label {
        font-family: 'EB Garamond', Garamond, serif;
        font-weight: 600;
        font-size: 20px;
        color: #6B1818;
        font-feature-settings: 'smcp' 1;  /* Small caps */
        white-space: nowrap;
        transform: translateX(-50%);  /* Center horizontally */
        z-index: 1;
        user-select: none;
        /* Warm parchment pill */
        background: linear-gradient(135deg, #F8F0E4 0%, #EDE4D4 100%);
        padding: 0px 12px 4px 12px;  /* Minimal top, more bottom to balance baseline */
        border-radius: 4px;
        border: 1px solid rgba(140, 110, 80, 0.35);
        box-shadow: 0 2px 4px rgba(30, 20, 10, 0.12);
        line-height: 1.1;
      }

      .pin-label {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 10px;
        color: #2E2A26;
        white-space: nowrap;
        transform: translateX(-50%);
        background: rgba(248, 240, 228, 0.85);
        padding: 1px 6px;
        border-radius: 2px;
        border: 1px solid rgba(140, 110, 80, 0.3);
        user-select: none;
        pointer-events: none;
      }

      .worker-label {
        font-family: 'EB Garamond', Garamond, serif;
        font-weight: 500;
        font-size: 14px;
        color: #2E2A26;  /* Black ink */
        font-feature-settings: 'pcap' 1;  /* Petite caps */
        white-space: nowrap;
        transform: translateX(-50%);  /* Center horizontally */
        pointer-events: auto;  /* Clickable (overrides container's none) */
        cursor: pointer;
        z-index: 10;  /* Always above city labels */
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        /* Parchment pill background */
        background: linear-gradient(135deg, #F5EDE0 0%, #E8DFD0 100%);
        padding: 0px 8px 3px 8px;  /* Minimal top, more bottom to balance baseline */
        border-radius: 3px;
        border: 1px solid rgba(46, 42, 38, 0.8);
        box-shadow: 0 1px 3px rgba(30, 20, 10, 0.15);
        line-height: 1.1;
      }

      .worker-label:hover {
        background: linear-gradient(135deg, #FFF8EE 0%, #F0E6D6 100%);
        border-color: rgba(140, 120, 90, 0.6);
      }

      .worker-label.working {
        font-weight: 600;
        background: linear-gradient(135deg, #F8F0E0 0%, #F0E4D0 100%);
        border-color: rgba(139, 74, 60, 0.4);
      }

      .worker-label.hidden {
        display: none !important;
      }

      /* Worker file hover tooltip */
      .worker-file-tooltip {
        position: fixed;
        z-index: 3000;
        min-width: 220px;
        max-width: 360px;
        padding: 8px;
        background: linear-gradient(180deg, #F4ECDD 0%, #E5DBCC 100%);
        border: 1px solid rgba(95, 73, 43, 0.35);
        border-radius: 6px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.35),
          0 6px 16px rgba(30, 20, 10, 0.22);
        pointer-events: auto;
      }

      .worker-file-tooltip-header {
        font-family: var(--font-main);
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-dark);
        font-variant: small-caps;
        letter-spacing: 0.04em;
        border-bottom: 1px solid rgba(110, 88, 55, 0.2);
        padding: 1px 2px 5px 2px;
        margin-bottom: 6px;
      }

      .worker-file-tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .worker-file-tooltip-item {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        border: 1px solid rgba(120, 96, 64, 0.2);
        border-radius: 4px;
        background: rgba(255, 252, 246, 0.7);
        padding: 5px 7px;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }

      .worker-file-tooltip-item:hover {
        border-color: rgba(138, 107, 42, 0.45);
        background: rgba(255, 248, 233, 0.95);
      }

      .worker-file-tooltip-basename {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .worker-file-tooltip-meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-faded);
      }

      .worker-file-tooltip-path {
        display: none;
        grid-column: 1 / -1;
        margin-top: 2px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-light);
        word-break: break-all;
      }

      .worker-file-tooltip-item:hover .worker-file-tooltip-path {
        display: block;
      }

      .worker-file-tooltip-empty {
        font-family: var(--font-main);
        font-size: 13px;
        font-style: italic;
        color: var(--ink-faded);
        padding: 2px 3px 3px 3px;
      }

      .worker-file-tooltip-empty.error {
        color: var(--rust);
      }

      /* ═══════════════════════════════════════════════════════════
         CITY PANEL — Antiquarian Field Notes
         ═══════════════════════════════════════════════════════════ */

      @keyframes panelSlideIn {
        from {
          transform: translateX(100%);
          opacity: 0.8;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes subtlePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      #city-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: calc(100vw / 3);
        height: 100vh;
        background:
          /* Subtle paper fiber texture */
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' seed='42'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='0.03'/%3E%3C/svg%3E"),
          /* Worn edge shadow - like a handled ledger */
          linear-gradient(90deg, rgba(80, 60, 40, 0.08) 0%, transparent 12%),
          /* Gentle vertical aging */
          linear-gradient(180deg,
            rgba(160, 130, 90, 0.04) 0%,
            transparent 15%,
            transparent 85%,
            rgba(140, 110, 70, 0.06) 100%
          ),
          /* Base parchment - warm brown-beige */
          linear-gradient(178deg,
            #DFD2C0 0%,
            #D8CBBA 25%,
            #D4C7B5 50%,
            #D0C2AF 75%,
            #CCBDA8 100%
          );
        border-left: 2px solid var(--parchment-edge);
        padding: 0;
        transform: translateX(100%);
        opacity: 0;
        overflow-y: scroll;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        z-index: 1000;
        box-shadow:
          -4px 0 16px rgba(60, 45, 30, 0.15),
          inset 4px 0 12px rgba(100, 80, 50, 0.04);
      }

      #city-panel.visible {
        animation: panelSlideIn 350ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Subtle top rule - like a ledger line */
      #city-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          var(--sepia-muted) 10%,
          var(--sepia-accent) 50%,
          var(--sepia-muted) 90%,
          transparent 100%
        );
        opacity: 0.5;
        pointer-events: none;
        z-index: 1;
      }

      /* Inner content wrapper */
      #city-panel > *:not(.resize-handle):not(.close-btn) {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      #city-panel .close-btn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        z-index: 10;
        background: var(--parchment-light);
        border: 1px solid var(--parchment-edge);
        font-size: 0.9rem;
        color: var(--ink-faded);
        cursor: pointer;
        padding: 0.2rem 0.5rem;
        line-height: 1;
        border-radius: 2px;
        transition: all 150ms ease;
      }

      #city-panel .close-btn:hover {
        color: var(--rust);
        border-color: var(--rust);
        background: rgba(138, 85, 72, 0.1);
      }

      #city-panel .resize-handle {
        position: absolute;
        left: 0;
        top: 0;
        width: 8px;
        height: 100%;
        cursor: ew-resize;
        background: transparent;
        transition: background 200ms ease;
        z-index: 10;
      }

      #city-panel .resize-handle:hover,
      #city-panel .resize-handle.dragging {
        background: linear-gradient(90deg,
          rgba(154, 123, 53, 0.3) 0%,
          transparent 100%
        );
      }

      /* ─── City Header ─────────────────────────────────────────── */

      #city-panel .city-name {
        font-family: var(--font-main);
        font-size: 1.5rem;
        font-variant: small-caps;
        text-transform: lowercase;
        letter-spacing: 0.06em;
        font-weight: 500;
        color: var(--ink-dark);
        margin: 1.25rem 0 0.25rem 0;
        padding-right: 3rem;
        padding-left: 1.5rem;
        position: relative;
      }

      /* Decorative flourish after city name */
      #city-panel .city-name::after {
        content: '';
      }

      #city-panel .city-path {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--ink-faded);
        margin: 0 0 0.5rem 0;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        word-break: break-all;
        letter-spacing: -0.02em;
      }

      #city-panel .git-status {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--ink-faded);
        margin: 0 0 0.75rem 0;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
      }

      #city-panel .git-branch {
        color: var(--verdigris);
        font-weight: 500;
      }

      #city-panel .git-sync {
        color: var(--sepia-accent);
      }

      #city-panel .git-staged {
        color: var(--ui-green);
      }

      #city-panel .git-unstaged {
        color: var(--sepia-accent);
      }

      #city-panel .git-untracked {
        color: var(--ink-faded);
      }

      #city-panel .git-add {
        color: var(--ui-green);
      }

      #city-panel .git-remove {
        color: var(--rust);
      }

      #city-panel .new-worker-btn {
        width: calc(100% - 3rem);
        margin: 0 1.5rem 1.25rem 1.5rem;
        padding: 0.6rem 1rem;
        font-family: var(--font-main);
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--sepia-accent);
        background: rgba(255, 255, 255, 0.3);
        border: 1px solid var(--parchment-edge);
        border-radius: 3px;
        cursor: pointer;
        transition: all 150ms ease;
      }

      #city-panel .new-worker-btn:hover {
        background: rgba(138, 107, 42, 0.1);
        border-color: var(--sepia-muted);
      }

      #city-panel .new-worker-btn:active {
        background: rgba(138, 107, 42, 0.15);
      }

      /* ─── Unified Search ──────────────────────────────────────── */

      #city-panel .unified-search-container {
        position: relative;
        margin: 0 1.5rem 1rem 1.5rem;
      }

      #city-panel .unified-search-input {
        width: 100%;
        padding: 0.6rem 2.5rem 0.6rem 1rem;
        font-family: var(--font-main);
        font-size: 0.9rem;
        color: var(--ink-body);
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid var(--parchment-edge);
        border-radius: 3px;
        outline: none;
        transition: all 150ms ease;
      }

      #city-panel .unified-search-input::placeholder {
        color: var(--ink-faded);
        font-style: italic;
      }

      #city-panel .unified-search-input:focus {
        border-color: var(--sepia-muted);
        background: rgba(255, 255, 255, 0.5);
      }

      #city-panel .unified-search-clear {
        position: absolute;
        right: 0.5rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        font-size: 1rem;
        color: var(--ink-faded);
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        line-height: 1;
        display: none;
        transition: color 150ms ease;
      }

      #city-panel .unified-search-clear:hover {
        color: var(--rust);
      }

      /* ─── Tab Bar ──────────────────────────────────────────────── */

      #city-panel .tab-bar {
        display: flex;
        gap: 0;
        margin: 0 1.5rem 1rem 1.5rem;
        border-bottom: 1px solid var(--parchment-edge);
      }

      #city-panel .tab {
        flex: 1;
        padding: 0.5rem 1rem;
        font-family: var(--font-main);
        font-size: 0.75rem;
        font-variant: small-caps;
        letter-spacing: 0.1em;
        color: var(--ink-faded);
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        transition: all 150ms ease;
      }

      #city-panel .tab:hover {
        color: var(--ink-light);
      }

      #city-panel .tab.active {
        color: var(--sepia-accent);
        border-bottom-color: var(--sepia-accent);
        font-weight: 500;
      }

      /* ─── Tab Content ──────────────────────────────────────────── */

      #city-panel .tab-content {
        display: block;
      }

      #city-panel .tab-pane {
        display: none;
      }

      #city-panel .tab-pane.active {
        display: block;
      }

      /* ─── Search Results Container ─────────────────────────────── */

      #city-panel .search-results-container {
        margin: 0;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      #city-panel .search-results-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: calc(100vh - 350px);
        overflow-y: auto;
      }

      #city-panel .search-result {
        padding: 0.5rem 0.6rem;
        margin-bottom: 0.25rem;
        background: rgba(255, 255, 255, 0.25);
        border: 1px solid transparent;
        border-left: 2px solid var(--verdigris);
        cursor: pointer;
        transition: all 150ms ease;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.3rem;
      }

      #city-panel .search-result:hover {
        background: rgba(138, 107, 42, 0.1);
        border-color: var(--parchment-edge);
      }

      #city-panel .search-result .result-icon {
        font-size: 0.8rem;
        margin-right: 0.3rem;
      }

      #city-panel .search-result.fiber-result {
        border-left-color: var(--sepia-accent);
      }

      #city-panel .search-result.fiber-result.task {
        border-left-color: var(--verdigris);
      }

      #city-panel .search-result.fiber-result.decision {
        border-left-color: var(--sepia-accent);
      }

      #city-panel .search-result.fiber-result.spec {
        border-left-color: var(--ui-purple);
      }

      #city-panel .search-result.fiber-result.question {
        border-left-color: var(--ui-green);
      }

      /* ─── Recent Files Section ─────────────────────────────────── */

      #city-panel .recent-files {
        margin: 0 0 1rem 0;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      #city-panel .recent-files h3 {
        font-family: var(--font-main);
        font-size: 0.7rem;
        font-variant: small-caps;
        text-transform: lowercase;

      #city-panel .recent-annotations-list {
        list-style: none;

        font-size: 0.7rem;
        color: var(--text-muted);

        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #city-panel .recent-annotation-item .annotation-time {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--text-muted);
        flex-basis: 100%;
        text-align: right;
      }

      /* ─── Section Headers ─────────────────────────────────────── */

      #city-panel .fibers {
        margin-bottom: 0;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      #city-panel .fibers h3 {
        font-family: var(--font-main);
        font-size: 0.7rem;
        font-variant: small-caps;
        text-transform: lowercase;
        letter-spacing: 0.12em;
        font-weight: 500;
        color: var(--ink-light);
        margin: 0 0 0.5rem 0;
        padding: 0.4rem 0;
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      /* Decorative lines beside section headers */
      #city-panel .fibers h3::before,
      #city-panel .fibers h3::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--parchment-edge);
        opacity: 0.6;
      }

      #city-panel .fibers h3::after {
        background: var(--parchment-edge);
        opacity: 0.6;
      }

      /* ─── Fiber List ──────────────────────────────────────────── */

      #city-panel .fiber-list {
        list-style: none;
        margin: 0 0 1.5rem 0;
        padding: 0;
      }

      #city-panel .fiber-item {
        padding: 0.6rem 0.75rem;
        margin-bottom: 0.35rem;
        background: rgba(255, 255, 255, 0.25);
        border: 1px solid transparent;
        border-left: 2px solid transparent;
        border-radius: 2px;
        cursor: pointer;
        transition: all 150ms ease;
        animation: fadeInUp 300ms ease backwards;
      }

      #city-panel .fiber-item:nth-child(1) { animation-delay: 50ms; }
      #city-panel .fiber-item:nth-child(2) { animation-delay: 100ms; }
      #city-panel .fiber-item:nth-child(3) { animation-delay: 150ms; }
      #city-panel .fiber-item:nth-child(4) { animation-delay: 200ms; }
      #city-panel .fiber-item:nth-child(5) { animation-delay: 250ms; }

      #city-panel .fiber-item:hover {
        background: rgba(138, 107, 42, 0.1);
        border-color: var(--parchment-edge);
      }

      /* Kind-specific left border colors */
      #city-panel .fiber-item.task { border-left-color: var(--verdigris); }
      #city-panel .fiber-item.decision { border-left-color: var(--sepia-accent); }
      #city-panel .fiber-item.spec { border-left-color: var(--ui-purple); }
      #city-panel .fiber-item.question { border-left-color: var(--ui-green); }

      #city-panel .fiber-item.has-content {
        cursor: pointer;
      }

      #city-panel .fiber-item.has-content .fiber-title::after {
        content: '›';
        display: inline-block;
        margin-left: 0.4rem;
        font-size: 0.9rem;
        color: var(--ink-faded);
        opacity: 0.5;
        transition: all 200ms ease;
        transform: rotate(0deg);
      }

      #city-panel .fiber-item.has-content.expanded .fiber-title::after {
        transform: rotate(90deg);
        opacity: 0.8;
      }

      #city-panel .fiber-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;

        width: 1rem;
        text-align: center;

      #city-panel .fiber-item:has(.fiber-status:contains('○')) .fiber-status { color: var(--ink-faded); }
      #city-panel .fiber-item:has(.fiber-status:contains('◐')) .fiber-status { color: var(--verdigris); }
      #city-panel .fiber-item:has(.fiber-status:contains('●')) .fiber-status { color: var(--sepia-accent); }

        flex: 1;
        font-family: var(--font-main);

        color: var(--ink-body);

        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.2rem 0.45rem;
        border-radius: 2px;
        font-weight: 500;
        white-space: nowrap;
      }

      #city-panel .fiber-item.task .fiber-kind {
        background: rgba(74, 98, 88, 0.15);
        color: var(--verdigris);
      }
      #city-panel .fiber-item.decision .fiber-kind {
        background: rgba(138, 107, 42, 0.15);
        color: var(--sepia-accent);
      }
      #city-panel .fiber-item.spec .fiber-kind {
        background: rgba(106, 88, 104, 0.15);
        color: var(--ui-purple);
      }
      #city-panel .fiber-item.question .fiber-kind {
        background: rgba(90, 107, 80, 0.15);
        color: var(--ui-green);
      }

        border: 1px solid transparent;
        color: var(--ink-faded);
        font-size: 0.8rem;

        cursor: pointer;
        opacity: 0;
        transition: all 150ms ease;
        margin-left: 0.25rem;

      #city-panel .fiber-item:hover .handoff-btn {

      #city-panel .handoff-btn:hover {
        opacity: 1;
        color: var(--sepia-accent);
        background: rgba(138, 107, 42, 0.1);
        border-color: var(--sepia-muted);

      /* ─── Reason Preview ──────────────────────────────────────── */

      #city-panel .fiber-reason-preview {
        display: none;

      #city-panel .fiber-reason-preview::before {
        content: '→ ';
        font-style: normal;
        color: var(--sepia-accent);
        opacity: 0.6;
      }

        display: none;

        display: grid;

        margin-top: 0;

      #city-panel .fiber-content > * {
        overflow: hidden;
        min-height: 0;
      }

      #city-panel .fiber-item.expanded .fiber-content {
        grid-template-rows: 1fr;
        margin-top: 0.6rem;

      #city-panel .fiber-item:not(.expanded) .fiber-content {
        max-height: 0;
        overflow: hidden;
      }

      #city-panel .fiber-body,
      #city-panel .fiber-reason {
        padding: 0.75rem 0.85rem;
        font-family: var(--font-main);
        font-size: 0.82rem;

        box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);

      #city-panel .fiber-body + .fiber-reason {
        margin-top: 0.5rem;
      }

      #city-panel .fiber-reason {
        border-left: 3px solid var(--gold);
        background:
          linear-gradient(135deg, rgba(154, 123, 53, 0.05), rgba(196, 168, 106, 0.03));
      }

      /* ─── Markdown Content ────────────────────────────────────── */

      #city-panel .fiber-body p,
      #city-panel .fiber-reason p {
        margin: 0 0 0.6em 0;
      }

      #city-panel .fiber-body p:last-child,
      #city-panel .fiber-reason p:last-child {
        margin-bottom: 0;
      }

      #city-panel .fiber-body code,
      #city-panel .fiber-reason code {
        background: rgba(139, 115, 85, 0.1);
        padding: 0.15em 0.35em;
        border-radius: 2px;
        font-family: var(--font-mono);
        font-size: 0.85em;
        color: var(--text-primary);
      }

      #city-panel .fiber-body pre,
      #city-panel .fiber-reason pre {
        background: rgba(46, 42, 38, 0.03);
        border: 1px solid var(--border-light);
        padding: 0.85em;
        border-radius: 3px;
        overflow-x: auto;
        margin: 0.6em 0;
      }

      #city-panel .fiber-body pre code,
      #city-panel .fiber-reason pre code {
        background: none;
        padding: 0;
      }

      #city-panel .fiber-body ul,
      #city-panel .fiber-body ol,
      #city-panel .fiber-reason ul,
      #city-panel .fiber-reason ol {
        margin: 0.5em 0;
        padding-left: 1.3em;
      }

      #city-panel .fiber-reason blockquote {

         CITY PANEL — Fireside Command Dark Theme
         ═══════════════════════════════════════════════════════════ */

      #city-panel.dark-theme {
        background:
          /* Subtle noise texture */
          url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E"),
          /* Warm gradient on dark */
          linear-gradient(135deg, var(--ui-dark) 0%, #1E1B19 50%, var(--ui-dark) 100%);
        border-left: 1px solid var(--ui-border);
        box-shadow:
          -8px 0 30px rgba(0, 0, 0, 0.5),
          -1px 0 0 var(--ui-border),
          inset 4px 0 20px rgba(0, 0, 0, 0.3);
      }

      /* Decorative top border - brighter gold on dark */
      #city-panel.dark-theme::before {
        background: linear-gradient(90deg,
          transparent 0%,
          var(--ui-gold-muted) 10%,
          var(--ui-gold) 30%,
          var(--ui-gold) 70%,
          var(--ui-gold-muted) 90%,
          transparent 100%
        );
        height: 3px;
      }

      /* ─── Dark Theme: City Header ────────────────────────────── */

      #city-panel.dark-theme .city-name {
        color: var(--ui-text);
      }

      #city-panel.dark-theme .city-name::after {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .city-path {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .git-status {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .git-branch {
        color: var(--ui-accent);
      }

      #city-panel.dark-theme .git-sync {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .git-staged {
        color: var(--ui-green);
      }

      #city-panel.dark-theme .git-unstaged {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .git-untracked {
        color: var(--ui-text-muted);

      #city-panel.dark-theme .git-add {

      #city-panel.dark-theme .git-remove {

      #city-panel.dark-theme .close-btn {

        border-color: var(--ui-border);
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .close-btn:hover {
        color: var(--ui-red);
        border-color: var(--ui-red);
        background: rgba(200, 128, 128, 0.15);
      }

      #city-panel.dark-theme .new-worker-btn {

      #city-panel.dark-theme .new-worker-btn:hover {

      /* ─── Dark Theme: Unified Search ─────────────────────────── */

      #city-panel.dark-theme .unified-search-input {
        color: var(--ui-text);
        background: var(--ui-dark-surface);
        border-color: var(--ui-border);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      #city-panel.dark-theme .unified-search-input::placeholder {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .unified-search-input:focus {
        border-color: var(--ui-gold);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.2),
          0 0 0 2px rgba(201, 162, 39, 0.2);
      }

      #city-panel.dark-theme .unified-search-clear {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .unified-search-clear:hover {
        color: var(--ui-red);
      }

      /* ─── Dark Theme: Tab Bar ──────────────────────────────────── */

      #city-panel.dark-theme .tab-bar {
        border-bottom-color: var(--ui-border);
      }

      #city-panel.dark-theme .tab {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .tab:hover {
        color: var(--ui-text-secondary);
      }

      #city-panel.dark-theme .tab.active {
        color: var(--ui-gold);
        border-bottom-color: var(--ui-gold);
      }

      /* ─── Dark Theme: Search Results ───────────────────────────── */

      #city-panel.dark-theme .search-result {
        background: rgba(45, 41, 38, 0.6);
        border-left-color: var(--ui-accent);
      }

      #city-panel.dark-theme .search-result:hover {

        border-color: var(--ui-border-light);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

      #city-panel.dark-theme .search-result.fiber-result.task {
        border-left-color: var(--ui-accent);
      }

      #city-panel.dark-theme .search-result.fiber-result.decision {
        border-left-color: var(--ui-gold);
      }

      #city-panel.dark-theme .search-result.fiber-result.spec {
        border-left-color: var(--ui-purple);
      }

      #city-panel.dark-theme .search-result.fiber-result.question {
        border-left-color: var(--ui-green);
      }

      /* ─── Dark Theme: Recent Files ─────────────────────────────── */

      #city-panel.dark-theme .recent-files h3 {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .recent-files h3::before,
      #city-panel.dark-theme .recent-files h3::after {
        background: linear-gradient(90deg, var(--ui-border) 0%, transparent 100%);
      }

      #city-panel.dark-theme .recent-files h3::after {
        background: linear-gradient(90deg, transparent 0%, var(--ui-border) 100%);
      }

      #city-panel.dark-theme .recent-file-item {
        background: rgba(45, 41, 38, 0.6);
        border-left-color: var(--ui-accent);
      }

      #city-panel.dark-theme .recent-file-item:hover {
        background: var(--ui-dark-surface);
        border-color: var(--ui-border-light);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #city-panel.dark-theme .recent-file-item .file-name {
        color: var(--ui-text);
      }

      #city-panel.dark-theme .recent-file-item .file-dir {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .recent-file-item .file-time {
        color: var(--ui-text-muted);
      }

      /* ─── Dark Theme: File Search ──────────────────────────────── */

      #city-panel.dark-theme .file-search h3 {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .file-search h3::before,
      #city-panel.dark-theme .file-search h3::after {
        background: linear-gradient(90deg, var(--ui-border) 0%, transparent 100%);
      }

      #city-panel.dark-theme .file-search h3::after {
        background: linear-gradient(90deg, transparent 0%, var(--ui-border) 100%);
      }

      #city-panel.dark-theme .file-search-input {
        color: var(--ui-text);
        background: var(--ui-dark-surface);
        border-color: var(--ui-border);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      #city-panel.dark-theme .file-search-input::placeholder {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .file-search-input:focus {
        border-color: var(--ui-gold);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), 0 0 0 2px rgba(201, 162, 39, 0.2);
      }

      #city-panel.dark-theme .file-search-mode {
        color: var(--ui-text-secondary);
        background: var(--ui-dark-surface);
        border-color: var(--ui-border);
      }

      #city-panel.dark-theme .file-search-mode:hover,
      #city-panel.dark-theme .file-search-mode:focus {
        border-color: var(--ui-gold);
      }

      #city-panel.dark-theme .file-search-clear {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .file-search-clear:hover {
        color: var(--ui-red);
      }

      #city-panel.dark-theme .file-result {
        background: rgba(45, 41, 38, 0.6);
        border-left-color: var(--ui-accent);
      }

      #city-panel.dark-theme .file-result:hover {
        background: var(--ui-dark-surface);
        border-color: var(--ui-border-light);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #city-panel.dark-theme .file-name {
        color: var(--ui-text);
      }

      #city-panel.dark-theme .file-line {
        color: var(--ui-accent);
      }

      #city-panel.dark-theme .file-dir {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .file-match {
        color: var(--ui-text-secondary);
        background: rgba(123, 163, 163, 0.1);
      }

      /* ─── Dark Theme: Recent Annotations ──────────────────────── */

      #city-panel.dark-theme .recent-annotations h3 {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .recent-annotations h3::before,
      #city-panel.dark-theme .recent-annotations h3::after {
        background: linear-gradient(90deg, var(--ui-border) 0%, transparent 100%);
      }

      #city-panel.dark-theme .recent-annotations h3::after {
        background: linear-gradient(90deg, transparent 0%, var(--ui-border) 100%);
      }

      #city-panel.dark-theme .recent-annotation-item {
        background: rgba(45, 41, 38, 0.6);
        border-left-color: var(--ui-gold);
      }

      #city-panel.dark-theme .recent-annotation-item:hover {
        background: var(--ui-dark-surface);
        border-color: var(--ui-gold);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      #city-panel.dark-theme .recent-annotation-item .file-name {
        color: var(--ui-text);
      }

      #city-panel.dark-theme .recent-annotation-item .annotation-count {
        background: var(--ui-gold);
        color: var(--ui-dark);
      }

      /* History entries (annotations cleared) - dimmed styling */
      #city-panel.dark-theme .recent-annotation-item.history {
        opacity: 0.6;
      }

      #city-panel.dark-theme .recent-annotation-item .annotation-count.history {
        background: var(--ui-text-muted);
        color: var(--ui-dark);
      }

      #city-panel.dark-theme .recent-annotation-item .file-dir {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .recent-annotation-item .annotation-time {
        color: var(--ui-text-muted);
      }

      /* ─── Dark Theme: Section Headers ────────────────────────── */

      #city-panel.dark-theme .fibers h3 {
        color: var(--ui-gold);
      }

      #city-panel.dark-theme .fibers h3::before,
      #city-panel.dark-theme .fibers h3::after {
        background: linear-gradient(90deg,
          var(--ui-border) 0%,
          transparent 100%
        );
      }

      #city-panel.dark-theme .fibers h3::after {
        background: linear-gradient(90deg,
          transparent 0%,
          var(--ui-border) 100%
        );
      }

      /* ─── Dark Theme: Fiber List ─────────────────────────────── */

      #city-panel.dark-theme .fiber-item {
        background: rgba(45, 41, 38, 0.6);
        border-color: transparent;
      }

      #city-panel.dark-theme .fiber-item:hover {
        background: var(--ui-dark-surface);
        border-color: var(--ui-border-light);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      }

      /* Kind-specific left border colors (brighter for dark bg) */
      #city-panel.dark-theme .fiber-item.task { border-left-color: var(--ui-accent); }
      #city-panel.dark-theme .fiber-item.decision { border-left-color: var(--ui-gold); }
      #city-panel.dark-theme .fiber-item.spec { border-left-color: var(--ui-purple); }
      #city-panel.dark-theme .fiber-item.question { border-left-color: var(--ui-green); }

      #city-panel.dark-theme .fiber-status {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .fiber-title {
        color: var(--ui-text);
      }

      #city-panel.dark-theme .fiber-item.has-content .fiber-title::after {
        color: var(--ui-text-muted);
      }

      /* Kind badges (brighter on dark) - more saturated for visual distinction */
      #city-panel.dark-theme .fiber-item.task .fiber-kind {
        background: rgba(90, 140, 140, 0.35);
        color: #8FC4C4;
      }
      #city-panel.dark-theme .fiber-item.decision .fiber-kind {
        background: rgba(201, 162, 39, 0.35);
        color: #E5C24D;
      }
      #city-panel.dark-theme .fiber-item.spec .fiber-kind {
        background: rgba(160, 120, 180, 0.35);
        color: #C4A0D8;
      }
      #city-panel.dark-theme .fiber-item.question .fiber-kind {
        background: rgba(100, 160, 100, 0.35);
        color: #8FD88F;
      }

      #city-panel.dark-theme .handoff-btn {
        color: var(--ui-text-muted);
      }

      #city-panel.dark-theme .handoff-btn:hover {
        color: var(--ui-gold);
        background: rgba(201, 162, 39, 0.15);
        border-color: var(--ui-gold-muted);
      }

      /* ─── Dark Theme: Expanded Content ───────────────────────── */

      #city-panel.dark-theme .fiber-body,
      #city-panel.dark-theme .fiber-reason {
        color: var(--ui-text-secondary);
        background: rgba(26, 24, 22, 0.6);
        border-color: var(--ui-border);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
      }

      #city-panel.dark-theme .fiber-reason {
        border-left-color: var(--ui-gold);
        background: rgba(201, 162, 39, 0.05);
      }

      #city-panel.dark-theme .fiber-body code,
      #city-panel.dark-theme .fiber-reason code {
        background: rgba(0, 0, 0, 0.3);
        color: var(--ui-text);
      }

      #city-panel.dark-theme .fiber-body pre,
      #city-panel.dark-theme .fiber-reason pre {
        background: rgba(0, 0, 0, 0.25);
        border-color: var(--ui-border);
      }

      #city-panel.dark-theme .fiber-body blockquote,
      #city-panel.dark-theme .fiber-reason blockquote {
        border-left-color: var(--ui-gold-muted);
        color: var(--ui-text-secondary);
      }

      /* ─── Dark Theme: Empty & Loading States ─────────────────── */

      #city-panel.dark-theme .empty,
      #city-panel.dark-theme .loading {
        color: var(--ui-text-muted);
      }

      /* ─── Dark Theme: Scrollbar ──────────────────────────────── */

      #city-panel.dark-theme::-webkit-scrollbar-thumb {
        background: var(--ui-border);
      }

      #city-panel.dark-theme::-webkit-scrollbar-thumb:hover {
        background: var(--ui-border-light);
      }

      /* ─── Dark Theme: Resize Handle ──────────────────────────── */

      #city-panel.dark-theme .resize-handle:hover,
      #city-panel.dark-theme .resize-handle.dragging {
        background: linear-gradient(90deg,
          rgba(201, 162, 39, 0.3) 0%,
          transparent 100%
        );
      }

      /* ═══════════════════════════════════════════════════════════
         CITY HUD — Right Sidebar
         ═══════════════════════════════════════════════════════════ */

      #city-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 900;
        --hud-sidebar-width: 320px;
        --hud-font-2xs: 0.5rem;
        --hud-font-xs: 0.75rem;
        --hud-font-sm: 0.85rem;
        --hud-font-md: 0.95rem;
        --hud-font-lg: 1.35rem;
      }

      .hud-sidebar {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: var(--hud-sidebar-width);
        max-width: min(92vw, 420px);
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--parchment-edge);
        background:
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' seed='42'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)' opacity='0.03'/%3E%3C/svg%3E"),
          linear-gradient(160deg,
            #DFD2C0 0%,
            #D8CBBA 40%,
            #D4C7B5 70%,
            #CCBDA8 100%
          );
        box-shadow:
          0 2px 12px rgba(60, 45, 30, 0.18),
          inset 0 1px 0 rgba(255, 250, 240, 0.3);
        transform: translateX(100%);
        transition: transform 250ms ease;
      }

      #city-hud.visible .hud-sidebar {
        transform: translateX(0);
      }

      .hud-header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--parchment-edge);
        flex-shrink: 0;
      }

      .hud-header-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .hud-close {
        background: transparent;
        border: 1px solid var(--parchment-edge);
        border-radius: 4px;
        color: var(--ink-light);
        font-size: var(--hud-font-md);
        line-height: 1;
        padding: 2px 7px;
        cursor: pointer;
      }

      .hud-close:hover {
        color: var(--ink-dark);
        background: rgba(60, 45, 30, 0.08);
      }

      .hud-header-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 2px;
      }

      .hud-city-name {
        font-family: var(--font-main);
        font-size: var(--hud-font-lg);
        font-weight: 600;
        font-variant: small-caps;
        font-feature-settings: 'smcp' 1, 'kern' 1, 'liga' 1;
        letter-spacing: 0.06em;
        color: var(--ink-dark);
        margin: 0;
        line-height: 1.2;
        white-space: nowrap;
      }

      .hud-actions {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }

      .hud-action-btn {
        background: transparent;
        border: 1px solid var(--parchment-edge);
        border-radius: 4px;
        color: var(--ink-light);
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        padding: 2px 8px;
        cursor: pointer;
        transition: background 120ms, color 120ms, border-color 120ms;
        line-height: 1.4;
      }

      .hud-action-btn:hover {
        background: rgba(60, 45, 30, 0.08);
        color: var(--ink-dark);
        border-color: var(--ink-faded);
      }

      .hud-city-path {
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-xs);
        color: var(--ink-faded);
        margin: 0 0 6px 0;
        letter-spacing: -0.01em;
        opacity: 0.85;
      }

      .hud-git-add {
        color: #5a8a5a;
      }

      .hud-git-rm {
        color: var(--rust);
      }

      .hud-gd-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 2px 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-sm);
        line-height: 1.5;
      }

      .hud-gd-label {
        color: var(--ink-faded);
        flex-shrink: 0;
        min-width: 56px;
      }

      .hud-gd-value {
        color: var(--ink-body);
        text-align: right;
      }

      .hud-gd-branch {
        color: var(--sepia-accent);
        font-weight: 500;
      }

      .hud-gd-ahead {
        color: #5a8a5a;
      }

      .hud-gd-behind {
        color: var(--rust);
      }

      .hud-gd-staged {
        color: #5a8a5a;
      }

      .hud-gd-unstaged {
        color: var(--sepia-muted);
      }

      .hud-gd-untracked {
        color: var(--ink-faded);
      }

      .hud-gd-commit {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--parchment-edge);
      }

      .hud-gd-commit-msg {
        display: block;
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        line-height: 1.4;
        font-style: italic;
      }

      .hud-gd-commit-time {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-xs);
        color: var(--ink-faded);
        margin-top: 2px;
      }

      .hud-tabbar {
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        border-top: 1px solid var(--parchment-edge);
        flex-shrink: 0;
      }

      .hud-tab {
        flex: 1;
        border: 1px solid var(--parchment-edge);
        border-radius: 4px;
        background: rgba(255, 250, 240, 0.3);
        color: var(--ink-light);
        font: 500 var(--hud-font-sm) var(--font-main);
        padding: 4px 6px;
        cursor: pointer;
      }

      .hud-tab.active {
        background: rgba(90, 123, 123, 0.12);
        color: var(--ink-dark);
        border-color: var(--ink-faded);
      }

      .hud-content {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .hud-pane {
        height: 100%;
        overflow: hidden;
      }

      .hud-pane.active {
        display: block;
      }

      .hud-fiber-list,
      .hud-search-results,
      .hud-file-tree {
        list-style: none;
        margin: 0;
        padding: 6px 8px;
        overflow-y: auto;
        height: 100%;
      }

      .hud-fiber-list::-webkit-scrollbar,
      .hud-search-results::-webkit-scrollbar,
      .hud-file-tree::-webkit-scrollbar {
        width: 4px;
      }
      .hud-fiber-list::-webkit-scrollbar-thumb,
      .hud-search-results::-webkit-scrollbar-thumb,
      .hud-file-tree::-webkit-scrollbar-thumb {
        background: var(--parchment-edge);
        border-radius: 2px;
      }

      .hud-fiber-item {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 5px 4px 5px 2px;
        cursor: pointer;
        border-radius: 3px;
        transition: background 120ms ease;
        font-size: var(--hud-font-md);
        line-height: 1.4;
      }

      .hud-fiber-item:hover {
        background: rgba(154, 123, 53, 0.08);
      }

      .hud-fiber-status {
        flex-shrink: 0;
        font-size: var(--hud-font-sm);
        width: 18px;
        text-align: center;
      }

      .hud-fiber-title {
        flex: 1;
        font-family: var(--font-main);
        color: var(--ink-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hud-fiber-kind {
        flex-shrink: 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-xs);
        color: var(--ink-faded);
        background: var(--parchment-dark);
        padding: 1px 5px;
        border-radius: 3px;
        letter-spacing: 0.02em;
      }

      /* Kind-specific accent colors */
      .hud-fiber-item.spec .hud-fiber-kind { color: var(--sepia-accent); }
      .hud-fiber-item.decision .hud-fiber-kind { color: #5a7b7b; }
      .hud-fiber-item.question .hud-fiber-kind { color: #7b5a8a; }
      .hud-fiber-item.doc .hud-fiber-kind { color: #5a6b8a; }

      .hud-fiber-handoff {
        flex-shrink: 0;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--ink-faded);
        font-size: var(--hud-font-sm);
        padding: 0 2px;
        opacity: 0;
        transition: opacity 120ms ease, color 120ms ease;
      }

      .hud-fiber-item:hover .hud-fiber-handoff {
        opacity: 1;
      }

      .hud-fiber-handoff:hover {
        color: var(--sepia-accent);
      }

      .hud-fiber-empty,
      .hud-file-empty {
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        color: var(--ink-faded);
        font-style: italic;
        padding: 4px 2px;
      }

      .hud-fiber-loading {
        font-style: normal;
      }

      .hud-tree-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 6px 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        line-height: 1.4;
      }

      .hud-tree-row:hover {
        background: rgba(154, 123, 53, 0.08);
      }

      .hud-tree-arrow {
        width: 12px;
        flex-shrink: 0;
        text-align: center;
        color: var(--ink-faded);
        font-size: var(--hud-font-xs);
      }

      .hud-tree-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hud-tree-status {
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        color: var(--ink-faded);
        font-style: italic;
        padding-top: 2px;
        padding-bottom: 2px;
      }

      .hud-tree-status.error {
        color: var(--rust);
      }

      .hud-search-bar {
        position: relative;
        padding: 10px;
        border-top: 1px solid var(--parchment-edge);
        flex-shrink: 0;
        background: rgba(248, 242, 232, 0.35);
      }

      .hud-search-input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255, 250, 240, 0.4);
        border: 1px solid var(--parchment-edge);
        border-radius: 4px;
        padding: 6px 26px 6px 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        outline: none;
        transition: border-color 150ms ease, background 150ms ease;
      }

      .hud-search-input::placeholder {
        color: var(--ink-faded);
        font-style: italic;
      }

      .hud-search-input:focus {
        border-color: var(--sepia-accent);
        background: rgba(255, 250, 240, 0.7);
      }

      .hud-search-clear {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-25%);
        background: none;
        border: none;
        color: var(--ink-faded);
        cursor: pointer;
        font-size: var(--hud-font-md);
        line-height: 1;
        padding: 2px 4px;
      }

      .hud-search-clear:hover {
        color: var(--ink-body);
      }

      .hud-search-results {
        min-height: 100%;
      }

      .hud-search-icon {
        flex-shrink: 0;
        font-size: var(--hud-font-xs);
        width: 16px;
        text-align: center;
        color: var(--ink-faded);
      }

      .hud-fiber-title.mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-sm);
      }

      .hud-search-empty,
      .hud-search-loading {
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        color: var(--ink-faded);
        font-style: italic;
        padding: 8px 2px;
      }

      .hud-header-workers {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid var(--parchment-edge);
      }

      .hud-header-workers:empty {
        display: none;
      }

      .hud-header-meeting {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid var(--parchment-edge);
      }

      .hud-header-meeting:empty {
        display: none;
      }

      .hud-header-workers-label {
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        font-variant: small-caps;
        font-feature-settings: 'smcp' 1;
        letter-spacing: 0.06em;
        color: var(--ink-faded);
        margin-right: 2px;
      }

      .hud-worker-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: var(--hud-font-xs);
        color: var(--ink-body);
        padding: 2px 8px 2px 6px;
        border-radius: 3px;
        cursor: pointer;
        transition: background 120ms;
        white-space: nowrap;
      }

      .hud-worker-chip:hover {
        background: rgba(90, 123, 123, 0.1);
      }

      .hud-worker-chip .hud-worker-dot {
        font-size: var(--hud-font-2xs);
      }

      .hud-worker-chip .hud-worker-dot.working {
        color: #5a7b7b;
      }

      .hud-worker-chip .hud-worker-dot.idle {
        color: var(--ink-faded);
      }

      .hud-worker-add {
        background: transparent;
        border: 1px solid var(--parchment-edge);
        border-radius: 3px;
        color: var(--ink-light);
        font-family: var(--font-main);
        font-size: var(--hud-font-xs);
        font-weight: 600;
        padding: 1px 8px;
        cursor: pointer;
        transition: background 120ms, color 120ms, border-color 120ms;
        line-height: 1.4;
      }

      .hud-worker-add:hover {
        background: rgba(60, 45, 30, 0.08);
        color: var(--ink-dark);
        border-color: var(--ink-faded);
      }

      .hud-meeting-header {
        display: flex;
        align-items: center;
      }

      .hud-meeting-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 9px;
        border: 1px solid rgba(120, 96, 64, 0.18);
        border-radius: 6px;
        background: rgba(255, 252, 246, 0.55);
      }

      .hud-meeting-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .hud-meeting-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 56px;
        padding: 1px 7px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: var(--hud-font-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(122, 115, 104, 0.16);
        color: var(--ink-light);
      }

      .hud-meeting-status.running {
        background: rgba(74, 98, 88, 0.16);
        color: var(--verdigris);
      }

      .hud-meeting-status.stopped {
        background: rgba(122, 115, 104, 0.16);
        color: var(--ink-light);
      }

      .hud-meeting-status.error {
        background: rgba(138, 85, 72, 0.16);
        color: var(--rust);
      }

      .hud-meeting-worker {
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--hud-font-xs);
        color: var(--ink-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hud-meeting-time,
      .hud-meeting-meta,
      .hud-meeting-empty {
        font-size: var(--hud-font-sm);
        color: var(--ink-faded);
      }

      .hud-meeting-time {
        margin-left: auto;
        white-space: nowrap;
      }

      .hud-meeting-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
      }

      .hud-meeting-preview {
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        line-height: 1.3;
      }

      .hud-meeting-brief {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px 7px;
        border: 1px solid rgba(120, 96, 64, 0.14);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(255, 252, 246, 0.86), rgba(247, 241, 232, 0.78));
      }

      .hud-meeting-brief-section,
      .hud-meeting-brief-narrative {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .hud-meeting-brief-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-left: 8px;
        border-left: 2px solid rgba(154, 123, 53, 0.28);
      }

      .hud-meeting-thread {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 6px 7px;
        border: 1px solid rgba(120, 96, 64, 0.14);
        border-radius: 5px;
        background: rgba(255, 252, 246, 0.72);
      }

      .hud-meeting-thread-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-left: 8px;
        border-left: 2px solid rgba(120, 96, 64, 0.16);
      }

      .hud-meeting-thread-item.selectable {
        cursor: pointer;
        padding: 5px 6px 5px 8px;
        margin-left: -6px;
        border-radius: 5px;
        transition: background 120ms, border-color 120ms, box-shadow 120ms;
      }

      .hud-meeting-thread-item.selectable:hover,
      .hud-meeting-thread-item.selectable:focus {
        outline: none;
        background: rgba(90, 123, 123, 0.08);
      }

      .hud-meeting-thread-item.selected {
        background: rgba(90, 123, 123, 0.12);
        box-shadow: inset 0 0 0 1px rgba(90, 123, 123, 0.16);
      }

      .hud-meeting-thread-transcript {
        border-left-color: rgba(90, 123, 123, 0.42);
      }

      .hud-meeting-thread-update {
        border-left-color: rgba(138, 85, 72, 0.42);
      }

      .hud-meeting-thread-candidate {
        border-left-color: rgba(154, 123, 53, 0.42);
      }

      .hud-meeting-thread-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-family: var(--font-mono);
        font-size: var(--hud-font-xs);
        color: var(--ink-faded);
      }

      .hud-meeting-thread-lane {
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-light);
      }

      .hud-meeting-thread-select {
        margin-left: auto;
        color: var(--verdigris);
      }

      .hud-meeting-thread-text {
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .hud-meeting-update-preview {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--hud-font-sm);
        color: var(--ink-body);
        line-height: 1.3;
      }

      .hud-meeting-update-label {
        font-family: var(--font-main);
        font-size: var(--hud-font-xs);
        font-variant: small-caps;
        font-feature-settings: 'smcp' 1;
        letter-spacing: 0.05em;
        color: var(--ink-faded);
      }

      .hud-meeting-error {
        font-size: var(--hud-font-sm);
        color: var(--rust);
        line-height: 1.3;
      }

      .hud-meeting-update {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 2px;
        border-top: 1px solid rgba(120, 96, 64, 0.12);
      }

      .hud-meeting-candidate-controls {
        display: flex;
        justify-content: flex-start;
      }

      .hud-meeting-candidate-kind,
      .hud-meeting-update-kind {
        max-width: 100%;
        border: 1px solid rgba(120, 96, 64, 0.24);
        border-radius: 999px;
        background: rgba(255, 252, 246, 0.92);
        color: var(--ink-body);
        font-family: var(--font-mono);
        font-size: var(--hud-font-xs);
        padding: 4px 10px;
      }

      .hud-meeting-candidate-title {
        width: 100%;
        border: 1px solid rgba(120, 96, 64, 0.24);
        border-radius: 6px;
        background: rgba(255, 252, 246, 0.92);
        color: var(--ink-body);
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        line-height: 1.35;
        padding: 7px 9px;
        box-sizing: border-box;
      }

      .hud-meeting-provenance {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 7px;
        border: 1px solid rgba(120, 96, 64, 0.14);
        border-radius: 6px;
        background: rgba(255, 252, 246, 0.72);
      }

      .hud-meeting-provenance-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .hud-meeting-provenance-selection,
      .hud-meeting-provenance-empty {
        font-size: var(--hud-font-sm);
        line-height: 1.3;
      }

      .hud-meeting-provenance-selection {
        color: var(--ink-body);
      }

      .hud-meeting-provenance-empty {
        color: var(--ink-faded);
      }

      .hud-meeting-update-input {
        width: 100%;
        min-height: 64px;
        resize: vertical;
        border: 1px solid rgba(120, 96, 64, 0.24);
        border-radius: 6px;
        background: rgba(255, 252, 246, 0.92);
        color: var(--ink-body);
        font-family: var(--font-main);
        font-size: var(--hud-font-sm);
        line-height: 1.35;
        padding: 8px 9px;
        box-sizing: border-box;
      }

      .hud-meeting-update-input:focus {
        outline: none;
        border-color: rgba(74, 98, 88, 0.42);
        box-shadow: 0 0 0 1px rgba(90, 123, 123, 0.18);
      }

      .hud-meeting-candidate-title:focus,
      .hud-meeting-candidate-kind:focus,
      .hud-meeting-update-kind:focus {
        outline: none;
        border-color: rgba(74, 98, 88, 0.42);
        box-shadow: 0 0 0 1px rgba(90, 123, 123, 0.18);
      }

      .hud-meeting-update-actions {
        display: flex;
        justify-content: flex-end;
      }

      .hud-meeting-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .hud-meeting-links {
        padding-top: 2px;
        border-top: 1px solid rgba(120, 96, 64, 0.12);
      }

      .hud-meeting-btn {
        background: transparent;
        border: 1px solid rgba(120, 96, 64, 0.28);
        border-radius: 999px;
        color: var(--ink-body);
        font-family: var(--font-mono);
        font-size: var(--hud-font-xs);
        padding: 3px 8px;
        cursor: pointer;
        transition: background 120ms, border-color 120ms, color 120ms;
      }

      .hud-meeting-btn:hover:not(:disabled) {
        background: rgba(90, 123, 123, 0.1);
        border-color: rgba(74, 98, 88, 0.36);
      }

      .hud-meeting-btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      @media (max-width: 720px) {
        #city-hud {
          --hud-sidebar-width: min(94vw, 360px);
          --hud-font-2xs: 0.45rem;
          --hud-font-xs: 0.65rem;
          --hud-font-sm: 0.75rem;
          --hud-font-md: 0.85rem;
          --hud-font-lg: 1.15rem;
        }
      }


      /* Worker picker modal */
      .worker-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fade-in 150ms ease-out;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .worker-picker {
        background: var(--ui-dark);
        border: 1px solid var(--ui-border);
        border-radius: 12px;
        width: 320px;
        max-height: 400px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .worker-picker-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--ui-border);
        font-size: 14px;
        font-weight: 600;
        color: var(--ui-text);
      }

      .worker-picker-close {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        font-size: 20px;
        cursor: pointer;
      }

      .worker-picker-close:hover {
        color: var(--ui-red);
      }

      .worker-picker-list {
        padding: 8px;
        max-height: 300px;
        overflow-y: auto;
      }

      .worker-picker-item {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 12px;
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        border-radius: 8px;
        margin-bottom: 6px;
        cursor: pointer;
        text-align: left;
        transition: all 150ms ease;
      }

      .worker-picker-item:hover {
        border-color: var(--sepia-accent);
        background: var(--parchment-light);
      }

      .worker-picker-item .worker-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--ui-text);
      }

      .worker-picker-item .worker-session {
        font-size: 11px;
        color: var(--ui-text-muted);
        font-family: var(--font-mono);
        margin-top: 2px;
      }

      .worker-picker-empty {
        color: var(--ui-text-muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }

      .worker-picker-global-comment {
        padding: 12px 12px 8px;
        border-bottom: 1px solid var(--ui-border);
      }

      .worker-picker-global-comment label {
        display: block;
        font-size: 11px;
        color: var(--ui-text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .global-comment-input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--ui-border);
        border-radius: 6px;
        background: var(--ui-dark-elevated);
        color: var(--ui-text);
        font-size: 13px;
        font-family: var(--font-body);
        resize: vertical;
        min-height: 50px;
      }

      .global-comment-input:focus {
        outline: none;
        border-color: var(--gold);
      }

      .global-comment-input::placeholder {
        color: var(--ui-text-muted);
      }

      .worker-picker-new {
        border-color: var(--gold) !important;
        background: rgba(154, 123, 53, 0.1) !important;
      }

      .worker-picker-new:hover {
        background: rgba(154, 123, 53, 0.2) !important;
      }

      .worker-picker-new .worker-name {
        color: var(--gold) !important;
      }
      /* ═══════════════════════════════════════════════════════════
         VIEW OVERLAY — Fullscreen iframe for Plots/Plans
         ═══════════════════════════════════════════════════════════ */

      .view-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .view-overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .view-overlay-frame {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--ui-dark);
        border: none;
      }

      .view-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        transition: opacity 300ms ease;
        display: none; /* Hidden by default - Safari ignores pointer-events on iframes */
      }

      .view-overlay.visible iframe {
        display: block; /* Show only when visible */
      }

      .view-overlay .loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
        display: none;
        align-items: center;
        justify-content: center;
        animation: subtlePulse 1.5s ease-in-out infinite;
      }

      /* ═══════════════════════════════════════════════════════════
         TABBED PLANS VIEW — Multi-origin plannotator overlay
         ═══════════════════════════════════════════════════════════ */

      .tabbed-plans-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--ui-dark);
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .tabbed-plans-overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .plans-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
      }

      .plans-tab-bar {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: var(--ui-dark-elevated);
        border-bottom: 1px solid var(--ui-border);
        min-height: 48px;
        align-items: center;
      }

      .plans-tab {
        padding: 8px 16px;
        background: transparent;
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .plans-tab:hover {
        color: var(--ui-text);
        border-color: var(--ui-gold-muted);
      }

      .plans-tab.active {
        background: var(--ui-dark);
        color: var(--ui-gold);
        border-color: var(--ui-gold);
      }

      .plans-iframe-container {
        flex: 1;
        position: relative;
        background: #1a1a1a;
      }

      .plans-iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .plans-empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--ui-text-muted);
        font-family: var(--font-main);
      }

      .plans-empty-state p {
        margin: 0;
        padding: 4px 0;
      }

      .plans-empty-hint {
        font-size: 0.85rem;
        color: var(--ui-text-dim);
        font-style: italic;
      }

      /* ═══════════════════════════════════════════════════════════
         CLAIMS DASHBOARD — Large Overlay Panel
         ═══════════════════════════════════════════════════════════ */

      .claims-dashboard {
        position: fixed;
        inset: 0;
        background: var(--ui-dark);
        z-index: 1500; /* Above city/worker panels */
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .claims-dashboard.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .claims-dashboard > .close-btn {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        padding: 0.2rem 0.55rem;
        line-height: 1;
        border-radius: 3px;
        opacity: 0.7;
        transition: all 200ms ease;
      }

      .claims-dashboard > .close-btn:hover {
        opacity: 1;
        color: var(--ui-red);
        border-color: var(--ui-red);
        background: rgba(200, 128, 128, 0.15);
      }

      .claims-dashboard-body {
        display: flex;
        position: absolute;
        inset: 0;
      }

      .claims-dashboard-content {
        flex: 1;
        position: relative;
        min-width: 0;
      }

      .claims-dashboard-content iframe {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
      }

      .claims-dashboard.visible .claims-dashboard-content iframe {
        display: block;
      }

      .claims-dashboard-content .loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
        animation: subtlePulse 1.5s ease-in-out infinite;
      }
      .claims-dashboard-content .loading-indicator.error {
        color: #8B4513;
        animation: none;
        font-style: normal;
      }

      /* ── Claims annotation side panel ── */

      .claims-annotation-panel {
        width: 280px;
        flex-shrink: 0;
        border-left: 1px solid var(--ui-border);
        display: flex;
        flex-direction: column;
        background: var(--ui-dark-elevated);
        overflow: hidden;
        transition: width 200ms ease;
      }

      .claims-annotation-panel.hidden {
        display: none;
      }

      .claims-annotation-panel.collapsed {
        width: 40px;
      }

      .claims-annotation-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid var(--ui-border);
        flex-shrink: 0;
      }

      .claims-annotation-header-actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .claims-annotation-clear-all {
        background: none;
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 0.58rem;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        cursor: pointer;
        transition: all 150ms;
      }
      .claims-annotation-clear-all:hover {
        color: var(--ui-red);
        border-color: var(--ui-red);
      }

      .claims-annotation-panel-header h3 {
        font-family: var(--font-main);
        font-size: 0.72rem;
        font-variant: small-caps;
        letter-spacing: 0.06em;
        color: var(--ui-gold);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
      }

      .claims-annotation-panel.collapsed .claims-annotation-panel-header h3 {
        display: none;
      }

      .claims-annotation-panel-toggle {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        cursor: pointer;
        font-size: 0.75rem;
        padding: 0.15rem 0.3rem;
        line-height: 1;
        flex-shrink: 0;
        transition: color 150ms;
      }
      .claims-annotation-panel-toggle:hover {
        color: var(--ui-text);
      }

      .claims-annotation-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
      }

      .claims-annotation-panel.collapsed .claims-annotation-list,
      .claims-annotation-panel.collapsed .claims-annotation-global-input,
      .claims-annotation-panel.collapsed .claims-annotation-footer {
        display: none;

      .claims-annotation-list .claims-ann-empty {

      /* Annotation card */
      .claims-ann-item {
        background: var(--ui-dark-surface);

        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        margin-bottom: 0.3rem;
        font-family: var(--font-main);
        font-size: 0.7rem;
        color: var(--ui-text);
        line-height: 1.4;

      .claims-ann-item:hover {

      .claims-ann-item .ann-selected-text {
        font-style: italic;

        font-size: 0.66rem;

      .claims-ann-item .ann-pin-label {
        font-size: 0.72rem;
        color: var(--ui-gold);

      }

      .claims-ann-item .ann-comment {
        color: var(--ui-text);
      }

      .claims-ann-item .ann-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;

        font-size: 0.62rem;
