<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexarchy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Local EB Garamond with full OpenType features (smcp, pcap) -->
    <style>
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Italic.otf') format('opentype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-SemiBold.otf') format('opentype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'EB Garamond';
        src: url('/fonts/EBGaramond-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- JetBrains Mono from Google Fonts (no special features needed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- Prism.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-tsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-rust.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-latex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --font-main: 'EB Garamond', Garamond, serif;
        --font-mono: 'JetBrains Mono', monospace;
        --bg-primary: #C8B8A8;
        --bg-card: #EDE8E0;
        --bg-elevated: #FDFCFA;
        --text-primary: #2E2A26;
        --text-secondary: #4A4540;
        --text-muted: #7A7368;
        --border: #A89888;
        --border-light: #C8BBA8;
        --accent: #5A7B7B;
        --gold: #9A7B35;
        --gold-light: #C4A86A;
        --green: #6B8B6B;
        --red: #A87070;

        /* Worn Ledger — Warm aged paper palette */
        --parchment-base: #D8CBBA;       /* deep warm parchment */
        --parchment-light: #E5D9C8;      /* lighter areas */
        --parchment-dark: #C9BAA5;       /* shadowed paper */
        --parchment-edge: #BBA890;       /* worn edges */
        --ink-dark: #2A2520;             /* deep ink for headings */
        --ink-body: #3D3630;             /* body text */
        --ink-light: #5A524A;            /* secondary text */
        --ink-faded: #7A7068;            /* muted/timestamps */
        --sepia-accent: #8A6B2A;         /* warm gold-brown accent */
        --sepia-muted: #A08858;          /* softer accent */
        --verdigris: #4A6258;            /* aged copper-green */
        --rust: #8A5548;                 /* attention/errors */
        --ui-dark: var(--parchment-base);
        --ui-dark-elevated: var(--parchment-light);
        --ui-dark-surface: var(--parchment-dark);
        --ui-border: #B8A890;
        --ui-border-light: #C8B8A0;
        --ui-gold: var(--sepia-accent);
        --ui-gold-muted: var(--sepia-muted);
        --ui-text: var(--ink-body);
        --ui-text-secondary: var(--ink-light);
        --ui-text-muted: var(--ink-faded);
        --ui-accent: var(--verdigris);
        --ui-green: #5A6B50;
        --ui-red: var(--rust);
        --ui-purple: #6A5868;
        --ui-teal: var(--verdigris);

        /* Custom cursor - the swallow for the whole map, beak tip is hotspot */
        --cursor-bird: url('/cursors/bird-small.png') 1 2, default;
      }
      body {
        overflow: hidden;
        background: var(--bg-primary);
        font-family: var(--font-main);
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ═══════════════════════════════════════════════════════════
         CSS2D LABELS — HTML overlays for proper OpenType features
         ═══════════════════════════════════════════════════════════ */

      .label-container {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .city-label {
        font-family: 'EB Garamond', Garamond, serif;
        font-weight: 600;
        font-size: 20px;
        color: #6B1818;
        font-feature-settings: 'smcp' 1;  /* Small caps */
        white-space: nowrap;
        transform: translateX(-50%);  /* Center horizontally */
        z-index: 1;
        user-select: none;
        /* Warm parchment pill */
        background: linear-gradient(135deg, #F8F0E4 0%, #EDE4D4 100%);
        padding: 0px 12px 4px 12px;  /* Minimal top, more bottom to balance baseline */
        border-radius: 4px;
        border: 1px solid rgba(140, 110, 80, 0.35);
        box-shadow: 0 2px 4px rgba(30, 20, 10, 0.12);
        line-height: 1.1;
      }

      /* Origin suffix shown when two cities share a name (e.g. a local and
         a remote ai-futures). Rendered as a quieter subscript so the city's
         name stays the dominant read. */
      .city-label-origin {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 400;
        font-feature-settings: normal;
        letter-spacing: 0.04em;
        color: var(--ink-faded, #7A7368);
        margin-left: 6px;
        vertical-align: baseline;
      }

      .worker-label {
        font-family: 'EB Garamond', Garamond, serif;
        font-weight: 500;
        font-size: 14px;
        color: #2E2A26;  /* Black ink */
        font-feature-settings: 'pcap' 1;  /* Petite caps */
        white-space: nowrap;
        transform: translateX(-50%);  /* Center horizontally */
        pointer-events: auto;  /* Clickable (overrides container's none) */
        cursor: pointer;
        z-index: 10;  /* Always above city labels */
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        /* Parchment pill background */
        background: linear-gradient(135deg, #F5EDE0 0%, #E8DFD0 100%);
        padding: 0px 8px 3px 8px;  /* Minimal top, more bottom to balance baseline */
        border-radius: 3px;
        border: 1px solid rgba(46, 42, 38, 0.8);
        box-shadow: 0 1px 3px rgba(30, 20, 10, 0.15);
        line-height: 1.1;
      }

      .worker-label:hover {
        background: linear-gradient(135deg, #FFF8EE 0%, #F0E6D6 100%);
        border-color: rgba(140, 120, 90, 0.6);
      }

      .worker-label.working {
        font-weight: 600;
        background: linear-gradient(135deg, #F8F0E0 0%, #F0E4D0 100%);
        border-color: rgba(139, 74, 60, 0.4);
      }

      .worker-label.hidden {
        display: none !important;
      }

      .worker-file-tooltip {
        position: fixed;
        z-index: 3000;
        min-width: 220px;
        max-width: 360px;
        padding: 8px;
        background: linear-gradient(180deg, #F4ECDD 0%, #E5DBCC 100%);
        border: 1px solid rgba(95, 73, 43, 0.35);
        border-radius: 6px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.35),
          0 6px 16px rgba(30, 20, 10, 0.22);
        pointer-events: auto;
      }

      .worker-file-tooltip-header {
        font-family: var(--font-main);
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-dark);
        font-variant: small-caps;
        letter-spacing: 0.04em;
        border-bottom: 1px solid rgba(110, 88, 55, 0.2);
        padding: 1px 2px 5px 2px;
        margin-bottom: 6px;
      }

      .worker-file-tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .worker-file-tooltip-item {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        border: 1px solid rgba(120, 96, 64, 0.2);
        border-radius: 4px;
        background: rgba(255, 252, 246, 0.7);
        padding: 5px 7px;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }

      .worker-file-tooltip-item:hover {
        border-color: rgba(138, 107, 42, 0.45);
        background: rgba(255, 248, 233, 0.95);
      }

      .worker-file-tooltip-basename {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-body);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .worker-file-tooltip-meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-faded);
      }

      .worker-file-tooltip-path {
        display: none;
        grid-column: 1 / -1;
        margin-top: 2px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--ink-light);
        word-break: break-all;
      }

      .worker-file-tooltip-item:hover .worker-file-tooltip-path {
        display: block;
      }

      .worker-file-tooltip-empty {
        font-family: var(--font-main);
        font-size: 13px;
        font-style: italic;
        color: var(--ink-faded);
        padding: 2px 3px 3px 3px;
      }

      .worker-file-tooltip-empty.error {
        color: var(--rust);
      }

      /* ═══════════════════════════════════════════════════════════
         CITY PANEL — Antiquarian Field Notes
         ═══════════════════════════════════════════════════════════ */

      @keyframes panelSlideIn {
        from {
          transform: translateX(100%);
          opacity: 0.8;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes subtlePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      /* Worker picker modal */
      .worker-picker-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fade-in 150ms ease-out;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .worker-picker {
        background: var(--ui-dark);
        border: 1px solid var(--ui-border);
        border-radius: 12px;
        width: 320px;
        max-height: 400px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      .worker-picker-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--ui-border);
        font-size: 14px;
        font-weight: 600;
        color: var(--ui-text);
      }

      .worker-picker-close {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        font-size: 20px;
        cursor: pointer;
      }

      .worker-picker-close:hover {
        color: var(--ui-red);
      }

      .worker-picker-list {
        padding: 8px;
        max-height: 300px;
        overflow-y: auto;
      }

      .worker-picker-item {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 12px;
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        border-radius: 8px;
        margin-bottom: 6px;
        cursor: pointer;
        text-align: left;
        transition: all 150ms ease;
      }

      .worker-picker-item:hover {
        border-color: var(--sepia-accent);
        background: var(--parchment-light);
      }

      .worker-picker-item .worker-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--ui-text);
      }

      .worker-picker-item .worker-session {
        font-size: 11px;
        color: var(--ui-text-muted);
        font-family: var(--font-mono);
        margin-top: 2px;
      }

      .worker-picker-empty {
        color: var(--ui-text-muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }

      .worker-picker-global-comment {
        padding: 12px 12px 8px;
        border-bottom: 1px solid var(--ui-border);
      }

      .worker-picker-global-comment label {
        display: block;
        font-size: 11px;
        color: var(--ui-text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .global-comment-input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--ui-border);
        border-radius: 6px;
        background: var(--ui-dark-elevated);
        color: var(--ui-text);
        font-size: 13px;
        font-family: var(--font-body);
        resize: vertical;
        min-height: 50px;
      }

      .global-comment-input:focus {
        outline: none;
        border-color: var(--gold);
      }

      .global-comment-input::placeholder {
        color: var(--ui-text-muted);
      }

      .worker-picker-new {
        border-color: var(--gold) !important;
        background: rgba(154, 123, 53, 0.1) !important;
      }

      .worker-picker-new:hover {
        background: rgba(154, 123, 53, 0.2) !important;
      }

      .worker-picker-new .worker-name {
        color: var(--gold) !important;
      }
      /* ═══════════════════════════════════════════════════════════
         VIEW OVERLAY — Fullscreen iframe for Plots/Plans
         ═══════════════════════════════════════════════════════════ */

      .view-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .view-overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .view-overlay-frame {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--ui-dark);
        border: none;
      }

      .view-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        transition: opacity 300ms ease;
        display: none; /* Hidden by default - Safari ignores pointer-events on iframes */
      }

      .view-overlay.visible iframe {
        display: block; /* Show only when visible */
      }

      .view-overlay .loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
        display: none;
        align-items: center;
        justify-content: center;
        animation: subtlePulse 1.5s ease-in-out infinite;
      }

      /* ═══════════════════════════════════════════════════════════
         TABBED PLANS VIEW — Multi-origin plannotator overlay
         ═══════════════════════════════════════════════════════════ */

      .tabbed-plans-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--ui-dark);
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .tabbed-plans-overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .plans-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
      }

      .plans-tab-bar {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: var(--ui-dark-elevated);
        border-bottom: 1px solid var(--ui-border);
        min-height: 48px;
        align-items: center;
      }

      .plans-tab {
        padding: 8px 16px;
        background: transparent;
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 150ms ease;
      }

      .plans-tab:hover {
        color: var(--ui-text);
        border-color: var(--ui-gold-muted);
      }

      .plans-tab.active {
        background: var(--ui-dark);
        color: var(--ui-gold);
        border-color: var(--ui-gold);
      }

      .plans-iframe-container {
        flex: 1;
        position: relative;
        background: #1a1a1a;
      }

      .plans-iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .plans-empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: var(--ui-text-muted);
        font-family: var(--font-main);
      }

      .plans-empty-state p {
        margin: 0;
        padding: 4px 0;
      }

      .plans-empty-hint {
        font-size: 0.85rem;
        color: var(--ui-text-dim);
        font-style: italic;
      }

      /* ═══════════════════════════════════════════════════════════
         CLAIMS DASHBOARD — Large Overlay Panel
         ═══════════════════════════════════════════════════════════ */

      .claims-dashboard {
        position: fixed;
        inset: 0;
        background: var(--ui-dark);
        z-index: 1500; /* Above city/worker panels */
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .claims-dashboard.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .claims-dashboard > .close-btn {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        padding: 0.2rem 0.55rem;
        line-height: 1;
        border-radius: 3px;
        opacity: 0.7;
        transition: all 200ms ease;
      }

      .claims-dashboard > .close-btn:hover {
        opacity: 1;
        color: var(--ui-red);
        border-color: var(--ui-red);
        background: rgba(200, 128, 128, 0.15);
      }

      .claims-dashboard-body {
        display: flex;
        position: absolute;
        inset: 0;
      }

      .claims-dashboard-content {
        flex: 1;
        position: relative;
        min-width: 0;
      }

      .claims-dashboard-content iframe {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
      }

      .claims-dashboard.visible .claims-dashboard-content iframe {
        display: block;
      }

      .claims-dashboard-content .loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
        animation: subtlePulse 1.5s ease-in-out infinite;
      }
      .claims-dashboard-content .loading-indicator.error {
        color: #8B4513;
        animation: none;
        font-style: normal;
      }

      /* ── Claims annotation side panel ── */

      .claims-annotation-panel {
        width: 280px;
        flex-shrink: 0;
        border-left: 1px solid var(--ui-border);
        display: flex;
        flex-direction: column;
        background: var(--ui-dark-elevated);
        overflow: hidden;
        transition: width 200ms ease;
      }

      .claims-annotation-panel.hidden {
        display: none;
      }

      .claims-annotation-panel.collapsed {
        width: 40px;
      }

      .claims-annotation-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid var(--ui-border);
        flex-shrink: 0;
      }

      .claims-annotation-header-actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .claims-annotation-clear-all {
        background: none;
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 0.58rem;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        cursor: pointer;
        transition: all 150ms;
      }
      .claims-annotation-clear-all:hover {
        color: var(--ui-red);
        border-color: var(--ui-red);
      }

      .claims-annotation-panel-header h3 {
        font-family: var(--font-main);
        font-size: 0.72rem;
        font-variant: small-caps;
        letter-spacing: 0.06em;
        color: var(--ui-gold);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
      }

      .claims-annotation-panel.collapsed .claims-annotation-panel-header h3 {
        display: none;
      }

      .claims-annotation-panel-toggle {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        cursor: pointer;
        font-size: 0.75rem;
        padding: 0.15rem 0.3rem;
        line-height: 1;
        flex-shrink: 0;
        transition: color 150ms;
      }
      .claims-annotation-panel-toggle:hover {
        color: var(--ui-text);
      }

      .claims-annotation-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
      }

      .claims-annotation-panel.collapsed .claims-annotation-list,
      .claims-annotation-panel.collapsed .claims-annotation-global-input,
      .claims-annotation-panel.collapsed .claims-annotation-footer {
        display: none;
      }

      .claims-annotation-list .claims-ann-empty {
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 0.68rem;
        font-style: italic;
        text-align: center;
        padding: 1rem 0.5rem;
      }

      /* Annotation card */
      .claims-ann-item {
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        padding: 0.4rem 0.5rem;
        margin-bottom: 0.3rem;
        font-family: var(--font-main);
        font-size: 0.7rem;
        color: var(--ui-text);
        line-height: 1.4;
        position: relative;
      }

      .claims-ann-item:hover {
        border-color: var(--ui-gold);
      }

      .claims-ann-item .ann-selected-text {
        font-style: italic;
        color: var(--ui-text-muted);
        margin-bottom: 0.2rem;
        font-size: 0.66rem;
        line-height: 1.35;
      }

      .claims-ann-item .ann-pin-label {
        font-size: 0.72rem;
        color: var(--ui-gold);
        margin-bottom: 0.3rem;
      }

      .claims-ann-item .ann-comment {
        color: var(--ui-text);
      }

      .claims-ann-item .ann-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.25rem;
        font-size: 0.62rem;
        color: var(--ui-text-muted);
      }

      .claims-ann-item .ann-actions {
        display: flex;
        gap: 0.4rem;
      }

      .claims-ann-item .ann-actions button {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        cursor: pointer;
        font-size: 0.66rem;
        padding: 0;
        opacity: 0;
        transition: opacity 150ms, color 150ms;
      }

      .claims-ann-item:hover .ann-actions button {
        opacity: 0.7;
      }

      .claims-ann-item .ann-actions button:hover {
        opacity: 1;
        color: var(--ui-gold);
      }

      .claims-ann-item .ann-actions button.ann-delete:hover {
        color: var(--ui-red);
      }

      /* Global feedback input (always available in sidebar) */
      .claims-annotation-global-input {
        flex-shrink: 0;
        border-top: 1px solid var(--ui-border);
        padding: 0.5rem 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .claims-annotation-global-input textarea {
        width: 100%;
        min-height: 2em;
        max-height: 5em;
        padding: 0.3rem 0.4rem;
        border: 1px solid var(--ui-border);
        border-radius: 3px;
        background: var(--ui-dark-surface);
        color: var(--ui-text);
        font-family: var(--font-main);
        font-size: 0.7rem;
        resize: none;
        box-sizing: border-box;
        line-height: 1.5;
      }

      .claims-annotation-global-input textarea:focus {
        outline: none;
        border-color: var(--ui-gold);
      }

      .claims-annotation-global-input .ann-global-save {
        align-self: flex-end;
        background: var(--ui-gold);
        border: none;
        color: #fff;
        font-family: var(--font-main);
        font-size: 0.72rem;
        padding: 0.25rem 0.6rem;
        border-radius: 3px;
        cursor: pointer;
        transition: opacity 150ms;
      }

      .claims-annotation-global-input .ann-global-save:hover {
        opacity: 0.85;
      }

      /* Footer (send all) */
      .claims-annotation-footer {
        flex-shrink: 0;
        border-top: 1px solid var(--ui-border);
        padding: 0.5rem 0.6rem;
      }

      .claims-annotation-footer:empty {
        display: none;
      }

      .claims-annotation-footer .ann-footer-btn {
        width: 100%;
        padding: 0.35rem 0.5rem;
        font-family: var(--font-main);
        font-size: 0.72rem;
        color: var(--ui-gold);
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        border-radius: 3px;
        cursor: pointer;
        transition: all 150ms;
      }

      .claims-annotation-footer .ann-footer-btn:hover {
        background: rgba(154, 123, 53, 0.15);
        border-color: var(--ui-gold);
      }

      /* ── Shared annotation panel (.ann-panel-*) ── */
      /* Used by TapestryView (.tapestry-annotation-panel). */

      .ann-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid var(--ui-border);
        flex-shrink: 0;
      }

      .ann-panel-header h3 {
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
      }

      .ann-panel-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ann-panel-clear-all {
        background: none;
        border: 1px solid var(--ui-border);
        color: var(--text-muted, var(--ui-text-muted));
        cursor: pointer;
        padding: 2px 8px;
        font-size: 10px;
        border-radius: 3px;
        transition: all 150ms;
      }
      .ann-panel-clear-all:hover {
        color: var(--ui-red);
        border-color: var(--ui-red);
      }

      .ann-panel-toggle {
        background: none;
        border: none;
        color: var(--text-muted, var(--ui-text-muted));
        cursor: pointer;
        padding: 2px 6px;
        font-size: 10px;
        flex-shrink: 0;
        transition: color 150ms;
      }
      .ann-panel-toggle:hover {
        color: var(--text-primary, var(--ui-text));
      }

      .ann-panel-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .ann-panel-empty {
        color: var(--text-muted, var(--ui-text-muted));
        font-size: 12px;
        font-style: italic;
        text-align: center;
        padding: 24px 12px;
      }

      .ann-panel-item {
        background: var(--bg-elevated, var(--ui-dark-surface));
        border: 1px solid var(--ui-border);
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        font-size: 12px;
        line-height: 1.4;
        position: relative;
      }
      .ann-panel-item:hover {
        border-color: var(--gold, var(--ui-gold));
      }

      .ann-panel-item .ann-comment {
        color: var(--text-primary, var(--ui-text));
        line-height: 1.4;
        margin-bottom: 6px;
      }

      .ann-panel-item .ann-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-muted, var(--ui-text-muted));
        font-size: 10px;
      }

      .ann-panel-item .ann-actions {
        display: flex;
        gap: 6px;
      }

      .ann-panel-item .ann-actions button {
        background: rgba(0, 0, 0, 0.15);
        border: 1px solid transparent;
        color: var(--text-muted, var(--ui-text-muted));
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        transition: all 150ms ease;
      }
      .ann-panel-item .ann-actions button:hover {
        background: rgba(0, 0, 0, 0.25);
        color: var(--text-primary, var(--ui-text));
      }
      .ann-panel-item .ann-actions .ann-action-delete:hover {
        color: var(--ui-red);
      }
      .ann-panel-item .ann-actions .ann-action-edit:hover {
        color: var(--gold, var(--ui-gold));
      }

      /* Inline edit textarea inside ann-panel-item */
      .ann-panel-item .ann-edit-textarea {
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        font-size: 12px;
        color: var(--text-primary, var(--ui-text));
        background: var(--bg-elevated, var(--ui-dark-surface));
        border: 1px solid var(--gold, var(--ui-gold));
        border-radius: 4px;
        resize: vertical;
        margin-bottom: 6px;
        box-sizing: border-box;
        font-family: inherit;
      }
      .ann-panel-item .ann-edit-textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(154, 123, 53, 0.3);
      }

      .ann-panel-item .ann-edit-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .ann-panel-item .ann-edit-save,
      .ann-panel-item .ann-edit-cancel {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .ann-panel-item .ann-edit-save {
        background: var(--gold, var(--ui-gold));
        color: white;
        border: none;
      }
      .ann-panel-item .ann-edit-save:hover {
        opacity: 0.85;
      }
      .ann-panel-item .ann-edit-cancel {
        background: transparent;
        color: var(--text-muted, var(--ui-text-muted));
        border: 1px solid var(--text-muted, var(--ui-border));
      }
      .ann-panel-item .ann-edit-cancel:hover {
        color: var(--text-primary, var(--ui-text));
        border-color: var(--text-primary, var(--ui-text));
      }

      /* Global input area */
      .ann-panel-global-input {
        flex-shrink: 0;
        border-top: 1px solid var(--ui-border);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ann-panel-global-input label {
        display: block;
        font-size: 11px;
        color: var(--text-muted, var(--ui-text-muted));
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .ann-panel-global-input textarea {
        width: 100%;
        min-height: 2em;
        max-height: 5em;
        padding: 8px 10px;
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        background: var(--bg-elevated, var(--ui-dark-surface));
        color: var(--text-primary, var(--ui-text));
        font-size: 12px;
        font-family: inherit;
        resize: none;
        box-sizing: border-box;
        line-height: 1.5;
      }
      .ann-panel-global-input textarea:focus {
        outline: none;
        border-color: var(--gold, var(--ui-gold));
      }
      .ann-panel-global-input .ann-global-save {
        align-self: flex-end;
        background: var(--gold, var(--ui-gold));
        border: none;
        color: #fff;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 3px;
        cursor: pointer;
        transition: opacity 150ms;
      }
      .ann-panel-global-input .ann-global-save:hover {
        opacity: 0.85;
      }

      /* Footer (send all / file as fiber) */
      .ann-panel-footer {
        flex-shrink: 0;
        border-top: 1px solid var(--ui-border);
        padding: 8px 12px;
        display: flex;
        gap: 6px;
      }
      .ann-panel-footer:empty {
        display: none;
      }
      .ann-panel-footer .ann-footer-btn {
        flex: 1;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--gold, var(--ui-gold));
        background: var(--bg-elevated, var(--ui-dark-surface));
        border: 1px solid var(--ui-border);
        border-radius: 3px;
        cursor: pointer;
        transition: all 150ms;
        white-space: nowrap;
      }
      .ann-panel-footer .ann-footer-btn:hover {
        background: rgba(154, 123, 53, 0.15);
        border-color: var(--gold, var(--ui-gold));
      }

      /* Collapsed state inherited from parent container */
      .collapsed .ann-panel-list,
      .collapsed .ann-panel-global-input,
      .collapsed .ann-panel-footer {
        display: none;
      }
      .collapsed .ann-panel-header h3 {
        display: none;
      }
      .collapsed .ann-panel-clear-all {
        display: none;
      }

      /* Claims-specific overrides (dark theme context) */
      .claims-annotation-panel .ann-panel-header h3 {
        font-family: var(--font-main);
        font-size: 0.72rem;
        font-variant: small-caps;
        letter-spacing: 0.06em;
        color: var(--ui-gold);
      }
      .claims-annotation-panel .ann-panel-item .ann-selected-text {
        font-style: italic;
        color: var(--ui-text-muted);
        margin-bottom: 0.2rem;
        font-size: 0.66rem;
        line-height: 1.35;
      }
      .claims-annotation-panel .ann-panel-item .ann-pin-label {
        font-size: 0.72rem;
        color: var(--ui-gold);
        margin-bottom: 0.3rem;
      }

      /* ═══════════════════════════════════════════════════════════
         TAPESTRY VIEW — Native DAG Visualization
         ═══════════════════════════════════════════════════════════ */

      .tapestry-view {
        position: fixed;
        inset: 0;
        background: var(--ui-dark);
        z-index: 1500;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .tapestry-view.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .tapestry-close {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        padding: 0.2rem 0.55rem;
        line-height: 1;
        border-radius: 3px;
        opacity: 0.7;
        transition: all 200ms ease;
      }

      .tapestry-close:hover {
        opacity: 1;
        color: var(--ui-red);
        border-color: var(--ui-red);
        background: rgba(200, 128, 128, 0.15);
      }

      .tapestry-body {
        display: flex;
        position: absolute;
        inset: 0;
      }

      .tapestry-main {
        flex: 1;
        display: flex;
        min-width: 0;
        position: relative;
      }

      .tapestry-dag-wrapper {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .tapestry-dag {
        flex: 1;
        overflow: hidden;
        position: relative;
        background: radial-gradient(
          ellipse at 50% 45%,
          #EDE8DC 0%,
          #E8DDD0 40%,
          #DCCFBA 80%,
          #D4C3A8 100%
        );
      }

      .tapestry-svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .tapestry-loading,
      .tapestry-empty {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
      }

      .tapestry-loading {
        animation: subtlePulse 1.5s ease-in-out infinite;
        z-index: 5;
      }

      .tapestry-loading.error {
        color: var(--ui-red);
        animation: none;
        font-style: normal;
      }

      /* ── DAG nodes ── */

      .tapestry-node {
        cursor: grab;
      }

      .tapestry-node:hover path {
        filter: brightness(1.15);
      }

      .tapestry-node.selected path:first-child {
        stroke-width: 2.5 !important;
      }

      .tapestry-node.search-match path:first-child {
        stroke-width: 2.5 !important;
        filter: brightness(1.2);
      }

      .tapestry-node-label {
        font-family: var(--font-main);
        fill: var(--ui-text);
        pointer-events: none;
      }

      .tapestry-hover-tooltip {
        display: none;
        position: fixed;
        z-index: 9999;
        max-width: 280px;
        padding: 0.45rem 0.65rem;
        background: #F5F0E8;
        border: 1px solid #C4B89A;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        font-family: var(--font-main);
        font-size: 13px;
        line-height: 1.45;
        color: var(--ui-text);
        pointer-events: none;
      }
      .tooltip-title {
        display: block;
        font-weight: 600;
        color: var(--ui-text);
        margin-bottom: 0;
      }
      .tooltip-divider {
        border: none;
        border-top: 1px solid #C4B89A;
        margin: 0.35rem 0;
      }
      .tooltip-outcome {
        color: #7A7368;
        font-style: italic;
      }

      .tapestry-link {
        fill: none;
        transition: stroke-opacity 0.15s ease;
      }

      /* ── Search ── */

      .tapestry-search {
        padding: 0.5rem 1rem;
        border-top: 1px solid var(--ui-border);
        flex-shrink: 0;
      }

      .tapestry-search input {
        width: 100%;
        font-family: var(--font-main);
        font-size: 0.85rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--ui-border);
        border-radius: 3px;
        background: var(--ui-dark-surface);
        color: var(--ui-text);
      }

      .tapestry-search input:focus {
        outline: none;
        border-color: var(--ui-teal);
      }

      .tapestry-search input::placeholder {
        color: var(--ui-text-muted);
        font-style: italic;
      }

      .tapestry-search-results {
        margin-top: 0.4rem;
        max-height: 120px;
        overflow-y: auto;
      }

      .tapestry-search-results .search-result {
        padding: 0.3rem 0.4rem;
        font-size: 0.8rem;
        cursor: pointer;
        border-radius: 2px;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--ui-text);
        font-family: var(--font-main);
      }

      .tapestry-search-results .search-result:hover,
      .tapestry-search-results .search-result.search-focused {
        background: var(--ui-dark-surface);
      }

      .tapestry-search-results .search-result.search-focused {
        outline: 1px solid var(--ui-teal);
        outline-offset: -1px;
      }

      .tapestry-search-results .search-result-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .tapestry-search-results .search-result-name {
        font-style: normal;
      }

      .tapestry-search-results .search-result-match {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--ui-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tapestry-search-results .search-no-results {
        font-size: 0.8rem;
        color: var(--ui-text-muted);
        font-style: italic;
        padding: 0.2rem 0;
      }

      /* ── Sidebar (fiber list + detail) ── */

      .tapestry-sidebar {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 20vw;
        min-width: 200px;
        border-left: 1px solid var(--ui-border);
        background: var(--ui-dark-elevated);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: width 200ms ease;
        z-index: 10;
        box-shadow: -3px 0 12px rgba(0, 0, 0, 0.18);
      }

      .tapestry-sidebar.expanded {
        width: 40vw;
        min-width: 300px;
      }

      .tapestry-fiber-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .tapestry-fiber-list.hidden {
        display: none;
      }

      .tapestry-fiber-list .tapestry-search {
        border-top: none;
        border-bottom: 1px solid var(--ui-border);
      }

      .tapestry-fiber-results {
        flex: 1;
        overflow-y: auto;
        padding: 0.2rem 0;
      }

      .fiber-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
        font-family: var(--font-main);
        font-size: 0.82rem;
        color: var(--ui-text);
        border-bottom: 1px solid transparent;
        transition: background 150ms;
      }

      .fiber-item:hover {
        background: var(--ui-dark-surface);
      }

      .fiber-item-rule {
        border-left: 2px solid var(--ui-teal);
      }

      .fiber-item .fiber-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fiber-item .fiber-kind {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.1rem 0.3rem;
        border-radius: 2px;
        background: var(--ui-dark-surface);
        color: var(--ui-text-muted);
      }

      .tapestry-sidebar-resize {
        position: absolute;
        left: -6px;
        top: 0;
        bottom: 0;
        width: 12px;
        cursor: col-resize;
        z-index: 11;
        display: none;
        align-items: center;
        justify-content: center;
      }

      /* Visual grip line — always faintly present */
      .tapestry-sidebar-resize::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--ui-border);
        opacity: 0.5;
        transition: opacity 150ms, width 150ms, background 150ms;
        pointer-events: none;
      }

      .tapestry-sidebar.expanded .tapestry-sidebar-resize {
        display: flex;
      }

      .tapestry-sidebar-resize:hover::after,
      .tapestry-sidebar-resize:active::after {
        width: 2px;
        background: var(--ui-gold);
        opacity: 0.6;
      }

      /* ── Collapsed sidebar ── */

      .tapestry-sidebar.collapsed {
        top: auto;
        width: auto;
        min-width: 0;
        border-left: none;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }

      .tapestry-sidebar.collapsed .tapestry-fiber-list {
        flex: none;
        overflow: visible;
      }

      .tapestry-sidebar.collapsed .tapestry-fiber-results,
      .tapestry-sidebar.collapsed .tapestry-legend,
      .tapestry-sidebar.collapsed .tapestry-sidebar-resize {
        display: none !important;
      }

      .tapestry-sidebar.collapsed .tapestry-fiber-list .tapestry-search {
        border-bottom: none;
      }

      .tapestry-sidebar.collapsed .tapestry-search {
        position: relative;
      }

      .tapestry-sidebar.collapsed .tapestry-search input {
        width: 180px;
        border-radius: 16px;
        padding: 0.45rem 0.8rem;
        background: var(--ui-dark-elevated);
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }

      .tapestry-sidebar.collapsed .tapestry-search-results {
        position: absolute;
        right: 0;
        bottom: 100%;
        width: 280px;
        max-height: 200px;
        background: var(--ui-dark-elevated);
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
        margin-bottom: 0.3rem;
        margin-top: 0;
        z-index: 20;
      }

      .fiber-item .fiber-dot {
        flex-shrink: 0;
        font-size: 0.65rem;
      }

      .fiber-item .fiber-tag {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 0.55rem;
        padding: 0.05rem 0.25rem;
        border-radius: 2px;
        background: var(--ui-dark-surface);
        color: var(--ui-text-muted);
        border: 1px solid var(--ui-border);
      }

      .tapestry-legend {
        flex-shrink: 0;
        padding: 0.4rem 0.8rem;
        border-top: 1px solid var(--ui-border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-family: var(--font-main);
        font-size: 0.7rem;
        color: var(--ui-text-muted);
      }

      .legend-item {
        white-space: nowrap;
      }

      .legend-sep {
        color: var(--ui-border);
      }

      .tapestry-detail-outcome {
        font-size: 0.82rem;
        color: var(--ui-text);
        margin-bottom: 0.6rem;
        padding-bottom: 0.6rem;
        border-bottom: 1px solid var(--ui-border);
        line-height: 1.45;
      }
      .tapestry-detail-outcome p { margin: 0.2rem 0; }
      .tapestry-detail-outcome p:first-of-type { display: inline; }
      .outcome-label {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ui-text-muted);
        margin-right: 0.4em;
      }
      .tapestry-detail-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-bottom: 0.5rem;
      }
      .fiber-tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--ui-text-muted);
        background: var(--ui-dark-surface);
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
      }
      .kind-badge {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--ui-text-muted);
        background: var(--ui-dark-surface);
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        text-transform: lowercase;
        flex-shrink: 0;
      }

      /* ── Detail panel ── */

      .tapestry-detail {
        flex: 1;
        flex-shrink: 0;
        background: var(--ui-dark-elevated);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .tapestry-detail.hidden {
        display: none;
      }

      .tapestry-detail-resize {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        cursor: col-resize;
        z-index: 10;
        background: transparent;
      }

      .tapestry-detail-resize:hover,
      .tapestry-detail-resize:active {
        background: var(--accent-gold);
        opacity: 0.4;
      }

      .tapestry-detail-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 0.6rem 0.8rem 0.2rem;
        flex-shrink: 0;
      }

      .tapestry-detail-title {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.3rem 0.4rem;
        min-width: 0;
      }

      .staleness-badge {
        font-size: 0.85rem;
        flex-shrink: 0;
      }

      .detail-name {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--ui-text);
      }

      .tapestry-detail-close {
        background: none;
        border: none;
        color: var(--ui-text-muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.1rem 0.3rem;
        line-height: 1;
        flex-shrink: 0;
      }

      .tapestry-detail-close:hover {
        color: var(--ui-text);
      }

      .tapestry-detail-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.2rem 0.5rem;
        padding: 0 0.8rem 0.5rem;
        font: 0.7rem/1.2 var(--font-mono);
        color: var(--ui-text-muted);
        border-bottom: 1px solid var(--ui-border);
        flex-shrink: 0;
      }

      .tapestry-detail-meta .detail-status {
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.1rem 0.35rem;
        border-radius: 2px;
        background: var(--ui-dark-surface);
      }

      .tapestry-detail-meta .tapestry-detail-tags {
        display: contents;
      }

      .detail-meta-spacer {
        flex: 1;
      }

      .tapestry-detail-meta .action {
        cursor: pointer;
        transition: color 0.15s;
        white-space: nowrap;
        user-select: none;
        font-size: 0.75rem;
      }

      .tapestry-detail-meta .action:hover {
        color: var(--accent-gold);
      }

      .tapestry-detail-meta .action.primary {
        color: var(--accent-gold);
        font-weight: 600;
      }

      .detail-dates {
        font-size: 0.75em;
        color: var(--ui-text-muted);
      }

      .tapestry-detail-content {
        flex: 1;
        overflow-y: auto;
        padding: 0.8rem;
      }

      /* Detail: upstream/downstream graph */
      .tapestry-detail-graph {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        padding-bottom: 0.6rem;
        margin-bottom: 0.6rem;
        border-bottom: 1px solid var(--ui-border);
      }

      .dep-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
      }

      .dep-dir-label {
        font-size: 0.68rem;
        color: var(--ui-text-muted);
        opacity: 0.6;
        font-family: var(--font-mono);
        min-width: 5.5rem;
        flex-shrink: 0;
      }

      .dep-tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        background: var(--ui-dark-surface);
        padding: 0.15rem 0.4rem;
        border-radius: 2px;
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        cursor: pointer;
        transition: all 150ms;
      }

      .dep-tag:hover {
        border-color: var(--ui-teal);
        color: var(--ui-teal);
      }

      /* Detail: artifact viewer */
      .tapestry-artifact-viewer {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-bottom: 0.8rem;
      }

      .tapestry-artifact {
        flex: 1;
      }

      .tapestry-artifact .artifact-label {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--ui-text-muted);
        margin-bottom: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .tapestry-artifact .artifact-media {
        width: 100%;
        border-radius: 2px;
        border: 1px solid var(--ui-border);
        transition: border-color 0.2s;
        overflow: hidden;
      }

      .tapestry-artifact .artifact-media:hover {
        border-color: var(--ui-teal);
      }

      .tapestry-artifact .artifact-media.image img {
        width: 100%;
        display: block;
        cursor: pointer;
        border: none;
        opacity: 1;
        transition: opacity 120ms ease;
      }

      .tapestry-artifact .artifact-media.image.loading img {
        opacity: 0;
      }

      .tapestry-artifact .artifact-media.pdf {
        --pdf-aspect-ratio: 0.7727;
        position: relative;
        width: 100%;
        aspect-ratio: var(--pdf-aspect-ratio);
        margin: 0 auto;
        background: var(--ui-dark-surface);
      }

      .tapestry-artifact .artifact-media.pdf canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: transparent;
        opacity: 1;
        transition: opacity 120ms ease;
      }

      .tapestry-artifact .artifact-media.pdf.loading canvas {
        opacity: 0;
      }

      .tapestry-artifact .artifact-open-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 2;
      }

      .tapestry-artifact-viewer .artifact-nav {
        font-size: 1.2rem;
        color: var(--ui-text-muted);
        cursor: pointer;
        padding: 0.4rem;
        user-select: none;
      }

      .tapestry-artifact-viewer .artifact-nav:hover {
        color: var(--ui-teal);
      }

      /* Detail: body (markdown) */
      .tapestry-detail-body {
        font-family: var(--font-main);
        font-size: 0.85rem;
        color: var(--ui-text);
        line-height: 1.6;
        margin-bottom: 0.8rem;
      }

      .tapestry-detail-body h1 { font-size: 1.1rem; margin: 0.8rem 0 0.4rem; }
      .tapestry-detail-body h2 {
        font-size: 0.95rem;
        margin: 0.6rem 0 0.3rem;
        color: var(--ui-gold);
        font-variant: small-caps;
        letter-spacing: 0.05em;
      }
      .tapestry-detail-body h3 { font-size: 0.85rem; margin: 0.5rem 0 0.2rem; }
      .tapestry-detail-body p { margin: 0.2rem 0; }
      .tapestry-detail-body ul, .tapestry-detail-body ol { margin: 0.2rem 0 0.2rem 1.5rem; padding: 0; }
      .tapestry-detail-body li { margin: 0.1rem 0; }
      .tapestry-detail-body code {
        font-family: var(--font-mono);
        font-size: 0.8em;
        background: rgba(0, 0, 0, 0.05);
        color: var(--ink-body);
        padding: 0.1rem 0.25rem;
        border-radius: 2px;
      }
      .config-resolved, .tapestry-detail-body .config-resolved {
        color: var(--ui-teal);
        font-weight: 500;
      }
      /* Inline code path links — clickable file references */
      .md-inline-code {
        font-family: var(--font-mono);
        font-size: 0.85em;
        background: rgba(0, 0, 0, 0.05);
        padding: 0.1rem 0.25rem;
        border-radius: 2px;
      }
      .md-inline-code[title],
      .tapestry-detail-body .md-inline-code[title] {
        color: var(--ui-teal);
        text-decoration: underline dotted;
      }
      .tapestry-detail-body pre {
        background: rgba(255, 255, 255, 0.35);
        border: 1px solid var(--ui-border-light);
        border-radius: 3px;
        padding: 0.5rem 0.7rem;
        overflow-x: auto;
        margin: 0.4rem 0;
      }
      .tapestry-detail-body pre code {
        background: none;
        padding: 0;
        color: var(--ink-body);
        font-size: 0.78rem;
        line-height: 1.5;
      }
      .tapestry-detail-body blockquote {
        border-left: 2px solid var(--ui-teal);
        padding-left: 0.7rem;
        margin: 0.4rem 0;
        color: var(--ui-text-muted);
        font-style: italic;
      }
      .tapestry-detail-body a,
      .tapestry-detail-body td a,
      .tapestry-detail-outcome a {
        color: var(--ui-teal) !important;
        text-decoration: underline dotted;
      }
      .tapestry-detail-body a:hover,
      .tapestry-detail-body td a:hover,
      .tapestry-detail-outcome a:hover {
        text-decoration: underline;
      }
      .tapestry-detail-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.4rem 0;
        font-size: 0.8rem;
      }
      .tapestry-detail-body th,
      .tapestry-detail-body td {
        padding: 0.3rem 0.5rem;
        border: 1px solid var(--ui-border);
        text-align: left;
      }
      .tapestry-detail-body th {
        background: var(--ui-dark-surface);
        font-weight: 600;
      }

      /* KaTeX: scale down math to match body text */
      .tapestry-detail-body .katex { font-size: 0.92em; }

      /* Editable markdown: shared hint + transition styles */
      .editable-markdown {
        cursor: text;
        position: relative;
        transition: opacity 0.15s ease;
      }
      .editable-markdown:not(.editing):hover::after {
        content: '✎';
        position: absolute;
        top: 0;
        right: 0;
        font-size: 0.7rem;
        color: var(--ui-text-muted);
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .editable-markdown:not(.editing):hover::after {
        opacity: 0.5;
      }
      .editable-markdown.editing {
        border-left: 2px solid var(--ui-gold);
        padding-left: 0.4rem;
        margin-left: -0.4rem;
      }
      .editable-markdown.dirty {
        border-left-color: var(--ui-teal);
      }
      .editable-markdown.editing .cm-editor {
        background: transparent;
      }

      /* Detail: evidence (code block) */
      .tapestry-evidence-section {
        margin-top: 0.8rem;
      }

      .tapestry-evidence {
        background: var(--ui-dark-surface);
        border-radius: 2px;
        padding: 0.5rem;
        max-height: 400px;
        overflow-y: auto;
      }

      .tapestry-evidence .evidence-item {
        display: flex;
        justify-content: space-between;
        padding: 0.2rem 0;
        font-size: 0.78rem;
      }

      .tapestry-evidence .evidence-key {
        font-family: var(--font-mono);
        color: var(--ui-text-muted);
      }

      .tapestry-evidence .evidence-value {
        font-family: var(--font-mono);
        color: var(--ui-text);
      }

      /* ── Annotation panel (reuses claims classes) ── */

      .tapestry-annotation-panel {
        width: 280px;
        flex-shrink: 0;
        border-left: 1px solid var(--ui-border);
        display: flex;
        flex-direction: column;
        background: var(--ui-dark-elevated);
        overflow: hidden;
        transition: width 200ms ease;
      }

      .tapestry-annotation-panel.hidden {
        display: none;
      }

      .tapestry-annotation-panel.collapsed {
        width: 40px;
      }

      /* ── Lightbox ── */

      .tapestry-lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .tapestry-lightbox img {
        max-width: 95%;
        max-height: 95%;
        border-radius: 2px;
        cursor: crosshair;
      }

      .tapestry-lightbox iframe {
        width: min(95vw, 1200px);
        height: 95vh;
        border: none;
        border-radius: 2px;
        background: white;
      }

      .tapestry-lightbox-pdf {
        width: min(95vw, 1200px);
        height: 95vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: white;
        border-radius: 2px;
        cursor: default;
      }
      .tapestry-lightbox-pdf canvas {
        display: block;
        width: 100%;
      }

      .tapestry-lightbox-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: none;
        border: none;
        color: rgba(255,255,255,0.7);
        font-size: 2rem;
        cursor: pointer;
        z-index: 2001;
      }

      .tapestry-lightbox-close:hover {
        color: white;
      }

      .tapestry-lightbox-label {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.6);
        background: rgba(0, 0, 0, 0.5);
        padding: 0.3rem 0.8rem;
        border-radius: 3px;
        pointer-events: none;
      }

      /* ── Annotation popover ── */

      .tapestry-ann-popover {
        position: fixed;
        z-index: 2100;
        width: 280px;
        background: var(--ui-dark-elevated);
        border: 1px solid var(--ui-border);
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .ann-popover-preview {
        font-family: var(--font-main);
        font-size: 0.75rem;
        color: var(--ui-text-muted);
        font-style: italic;
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ann-popover-input {
        width: 100%;
        font-family: var(--font-main);
        font-size: 0.82rem;
        color: var(--ui-text);
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        border-radius: 2px;
        padding: 0.35rem 0.5rem;
        resize: vertical;
        min-height: 2.5rem;
        line-height: 1.4;
      }

      .ann-popover-input:focus {
        outline: none;
        border-color: var(--ui-teal);
      }

      .ann-popover-input::placeholder {
        color: var(--ui-text-muted);
        font-style: italic;
      }

      .ann-popover-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.4rem;
      }

      .ann-popover-actions button {
        font-family: var(--font-main);
        font-size: 0.72rem;
        padding: 0.2rem 0.6rem;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid var(--ui-border);
        transition: all 150ms;
      }

      .ann-popover-cancel {
        background: transparent;
        color: var(--ui-text-muted);
      }

      .ann-popover-cancel:hover {
        color: var(--ui-text);
        border-color: var(--ui-text-muted);
      }

      .ann-popover-save {
        background: var(--ui-teal);
        color: var(--ui-dark);
        border-color: var(--ui-teal);
      }

      .ann-popover-save:hover {
        filter: brightness(1.1);
      }

      /* ═══════════════════════════════════════════════════════════
         PLAYGROUND VIEWER — Large Overlay Panel
         ═══════════════════════════════════════════════════════════ */

      .playground-viewer {
        position: fixed;
        top: 2vh;
        left: 2vw;
        right: 2vw;
        bottom: 2vh;
        background: var(--ui-dark);
        border-radius: 8px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        z-index: 1500; /* Above city/worker panels */
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms ease;
      }

      .playground-viewer.visible {
        pointer-events: auto;
        opacity: 1;
      }

      .playground-viewer-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: var(--ui-dark-elevated);
        border-bottom: 1px solid var(--ui-border);
        border-radius: 8px 8px 0 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1rem;
      }

      .playground-viewer-header h2 {
        font-family: var(--font-main);
        font-size: 1rem;
        font-variant: small-caps;
        letter-spacing: 0.08em;
        color: var(--ui-teal);
        margin: 0;
        flex-shrink: 0;
      }

      .playground-viewer .playground-list {
        display: flex;
        gap: 0.5rem;
        flex: 1;
        overflow-x: auto;
      }

      .playground-viewer .playground-tab {
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 0.35rem 0.8rem;
        border-radius: 3px;
        cursor: pointer;
        transition: all 200ms ease;
        white-space: nowrap;
      }

      .playground-viewer .playground-tab:hover {
        color: var(--ui-text);
        border-color: var(--ui-text-muted);
      }

      .playground-viewer .playground-tab.active {
        background: var(--ui-teal);
        border-color: var(--ui-teal);
        color: var(--ui-dark);
      }

      .playground-viewer .close-btn {
        background: var(--ui-dark-surface);
        border: 1px solid var(--ui-border);
        color: var(--ui-text-muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.25rem 0.6rem;
        line-height: 1;
        border-radius: 3px;
        transition: all 200ms ease;
        flex-shrink: 0;
      }

      .playground-viewer .close-btn:hover {
        color: var(--ui-red);
        border-color: var(--ui-red);
        background: rgba(200, 128, 128, 0.15);
      }

      .playground-viewer iframe {
        position: absolute;
        top: 48px;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: calc(100% - 48px);
        border: none;
        display: none; /* Hidden by default - Safari ignores pointer-events on iframes */
      }

      .playground-viewer.visible iframe {
        display: block; /* Show only when visible */
      }

      .playground-viewer .loading-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--ui-text-muted);
        font-family: var(--font-main);
        font-size: 1rem;
        font-style: italic;
        animation: subtlePulse 1.5s ease-in-out infinite;
      }

      /* Modal chrome alignment — the portolan-injected close button (×),
         vellum's file-mode toolbar (left column top), and the thumb-index
         header (right column top) share the same horizontal band.
         The toolbar gets bumped padding-top/bottom so its content centres
         on the same y as the thumb-index's first row of mode tabs; the
         thumb-index's own top padding is tightened so the bands' bottoms
         align at ~46-48px. The close button (× in mount.tsx) follows
         the new centreline via top:14px. See vellum-reader/modal-chrome-alignment
         and vellum-reader/title-bar-thumb-index-alignment. */
      .vellum-workspace-modal-container .vellum-file-mode__toolbar {
        padding: 14px 8px 14px 44px;
      }
      .vellum-workspace-modal-container .thumb-index {
        padding-top: 10px;
      }
      /* Vellum's lightcone-linear theme suppresses the thumb-index for clean
         prose reading (vellum.css `:root[data-theme="lightcone-linear"]
         .thumb-index { display: none }`). Inside portolan's embed the
         thumb-index is the only way to flip between Narrative / Kanban /
         Delta — without it the user can enter Kanban (via launch button or
         hotkey k) with no path back to the prose. Re-enable visibility for
         the embedded modal regardless of theme; the user's theme preference
         still drives margin chrome and prose width on Narrative, just not
         the mode-switching tabs. See ai-futures/portolan/vellum-reader/
         constitution-vellum-kanban §"Hotkey k semantics". */
      :root[data-theme="lightcone-linear"] .vellum-workspace-modal-container .thumb-index {
        /* `!important` matches vellum.css's theme rule, which uses
           `display: none !important` to win over scoped CSS. The override
           is intentional: in the embed, the user's theme preference
           shouldn't gate access to the mode tabs. */
        display: block !important;
      }
      /* Active state for the close button (overrides the inline mouseenter
         styles when held down). Also lightens the affordance for keyboard
         focus so tab-navigators see it. */
      .vellum-workspace-modal-close:active {
        background: rgba(160, 48, 48, 0.16) !important;
      }
      .vellum-workspace-modal-close:focus-visible {
        outline: 2px solid rgba(154, 123, 53, 0.55);
        outline-offset: 2px;
      }

      /* Vellum's HtmlReader doesn't size its iframe — cross-origin
         iframe content can't tell the parent its height, and vellum has
         no CSS rule for `.vellum-file-reader--html`. Browser default
         (~150px) collapses the paper view. The astra paper view is also
         wider than vellum's prose column, so we widen the page when an
         html reader is mounted, and turn the modal column into a flex
         chain so heights propagate down to the iframe. See
         vellum-reader/astra-yaml-paper-view.

         The same flex chain + column widening applies when the vellum-
         native astra rungs (linear / personal) are mounted: the marker
         is the wrapping `.astra-paper-view-host` (which contains the
         iframe in paper-view rung and `<AstraPaperView>` in linear /
         personal). Without the chain, vellum-page's lightcone-linear
         max-width:720px clamps the host to a column too narrow to host
         the 220px-wide annotation gutter — margin notes hang past the
         host's overflow-x:hidden cut and disappear. See
         vellum-reader/astra-margin-note-gutter-clip. */
      .vellum-workspace-modal-container:has(.vellum-file-reader--html) > div,
      .vellum-workspace-modal-container:has(.astra-paper-view-host) > div {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      :root .vellum-workspace-modal-container:has(.vellum-file-reader--html) .vellum-page,
      :root .vellum-workspace-modal-container:has(.astra-paper-view-host) .vellum-page {
        max-width: none;
        /* Reserve the canvas-width gutter on the right so the iframe
           shrinks when the user drags the thumb-index divider, instead
           of the thumb-index sitting on top of the paper view. The
           outer container is `display: flex; flex-direction: column`
           with `align-items: stretch`, so `margin-right` on a flex
           item doesn't actually shrink the box — the cross-axis stretch
           overrides it. Compute the width directly and pin it to the
           left edge with `align-self: flex-start`. See
           vellum-reader/astra-paper-view-canvas-reflow. */
        width: calc(100% - var(--canvas-width, 0px));
        align-self: flex-start;
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .vellum-workspace-modal-container:has(.vellum-file-reader--html) .vellum-file-mode,
      .vellum-workspace-modal-container:has(.astra-paper-view-host) .vellum-file-mode {
        flex: 1;
        min-height: 0;
      }
      .vellum-workspace-modal-container:has(.vellum-file-reader--html) .vellum-file-mode__body,
      .vellum-workspace-modal-container:has(.vellum-file-reader--html) .vellum-file-viewer-page,
      .vellum-workspace-modal-container:has(.astra-paper-view-host) .vellum-file-mode__body,
      .vellum-workspace-modal-container:has(.astra-paper-view-host) .vellum-file-viewer-page {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .vellum-file-reader--html {
        flex: 1;
        width: 100%;
        height: 100%;
        min-height: 70vh;
        border: 0;
        display: block;
        background: var(--page-bg, #EDE8E0);
      }
      /* Reserve a real right gutter for annotation margin notes when the
         vellum-native astra rungs (linear / personal) are mounted in
         the modal. Notes hang at `left: calc(100% + 12px)` from
         `.astra-paper-view-anchor` (sized like the article: 760px
         linear, 920px personal); they're 220px wide. Without padding-
         right here, the host's overflow-x:hidden clips the notes
         against the column's right edge — the marquee gutter affordance
         was invisible. The padding widens the clip box so notes that
         hang past the centered article land within the host's padding-
         box.

         Scoped to hosts that contain `.astra-paper-view-anchor` (linear /
         personal) so the paper-view rung's iframe still gets the full
         host width — paper-view doesn't carry annotation margin notes
         (the iframe is a separate origin; TextAnnotationLayer is gated
         to the vellum-native rungs in FileViewerPage). Cards (sticky-
         notes) sit outside the workspace modal so they're also untouched.
         Gated to viewports > 960px so narrow viewports don't waste a
         third of the column on a gutter that vellum already hides
         (vellum.css `@media (max-width: 960px) .ann-margin-note { display: none; }`).
         See vellum-reader/astra-margin-note-gutter-clip. */
      @media (min-width: 961px) {
        .vellum-workspace-modal-container .astra-paper-view-host:has(.astra-paper-view-anchor) {
          padding-right: calc(var(--canvas-overlay-width, 220px) + 12px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" role="img" aria-label="Portolan map — cities and workers"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
