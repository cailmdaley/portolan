[package]
name = "portolan-index"
version = "0.1.0"
description = "Rust-owned local file indexing substrate for Portolan"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "portolan-index"
path = "src/main.rs"
