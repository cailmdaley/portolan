[package]
name = "portolan-agent-protocol"
version = "0.1.0"
description = "Typed remote-agent WebSocket protocol frames for Portolan"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
