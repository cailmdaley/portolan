[package]
name = "portolan-agent"
version = "0.1.0"
description = "Preview Rust remote-agent binary for Portolan"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
futures-util = "0.3"
hostname = "0.4"
portolan-agent-protocol = { path = "../portolan-agent-protocol" }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.24"
urlencoding = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = "1.0"

[[bin]]
name = "portolan-agent-rust"
path = "src/main.rs"
