[package]
name = "portolan-agent"
version = "0.1.0"
description = "Preview Rust remote-agent binary for Portolan"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
chrono = { version = "0.4", default-features = false }
futures-util = "0.3"
hostname = "0.4"
notify = "6.1"
portolan-agent-protocol = { path = "../portolan-agent-protocol" }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.24"
urlencoding = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "portolan-agent-rust"
path = "src/main.rs"
