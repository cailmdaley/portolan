<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coastline Waves — Portolan Playground</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #1a1a1a;
    color: #ccc;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Controls panel */
  .controls {
    width: 320px;
    min-width: 320px;
    background: #222;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .controls h1 {
    font-size: 16px;
    color: #eee;
    margin-bottom: 4px;
  }
  .controls p.subtitle {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }

  .group {
    border: 1px solid #333;
    border-radius: 6px;
    padding: 12px;
  }
  .group h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #999;
    margin-bottom: 10px;
  }
  .control {
    margin-bottom: 10px;
  }
  .control:last-child { margin-bottom: 0; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .control label .val {
    color: #ddd;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #5A7B7B;
    height: 4px;
  }
  input[type="color"] {
    width: 32px;
    height: 24px;
    border: 1px solid #444;
    border-radius: 3px;
    background: none;
    cursor: pointer;
  }
  .color-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .color-row span {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: #aaa;
  }

  /* Presets */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .presets button {
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #ccc;
    cursor: pointer;
    transition: all 0.15s;
  }
  .presets button:hover {
    background: #333;
    border-color: #5A7B7B;
    color: #eee;
  }

  /* Checkbox */
  .check-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #aaa;
  }
  .check-row input { accent-color: #5A7B7B; }

  /* Preview */
  .preview {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Prompt */
  .prompt-bar {
    background: #1e1e1e;
    border-top: 1px solid #333;
    padding: 12px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .prompt-text {
    flex: 1;
    font-size: 12px;
    line-height: 1.5;
    color: #bbb;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: pre-wrap;
    max-height: 80px;
    overflow-y: auto;
  }
  .copy-btn {
    padding: 6px 14px;
    font-size: 11px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #ccc;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .copy-btn:hover { background: #333; border-color: #5A7B7B; }
  .copy-btn.copied { background: #5A7B7B; color: #fff; border-color: #5A7B7B; }
</style>
</head>
<body>

<div class="controls">
  <div>
    <h1>Coastline Waves</h1>
    <p class="subtitle">Wave animation for remote city hexagons</p>
  </div>

  <div class="group">
    <h2>Presets</h2>
    <div class="presets">
      <button onclick="applyPreset('gentle')">Gentle Tide</button>
      <button onclick="applyPreset('cartographic')">Cartographic</button>
      <button onclick="applyPreset('stormy')">Stormy</button>
      <button onclick="applyPreset('shallow')">Shallow Wash</button>
      <button onclick="applyPreset('deep')">Deep Water</button>
    </div>
  </div>

  <div class="group">
    <h2>Waves</h2>
    <div class="control">
      <label>Layers <span class="val" id="v-layers">3</span></label>
      <input type="range" id="layers" min="1" max="6" step="1" value="3">
    </div>
    <div class="control">
      <label>Amplitude <span class="val" id="v-amplitude">8</span></label>
      <input type="range" id="amplitude" min="1" max="30" step="0.5" value="8">
    </div>
    <div class="control">
      <label>Frequency <span class="val" id="v-frequency">3</span></label>
      <input type="range" id="frequency" min="1" max="12" step="0.5" value="3">
    </div>
    <div class="control">
      <label>Speed <span class="val" id="v-speed">0.8</span></label>
      <input type="range" id="speed" min="0.1" max="3" step="0.1" value="0.8">
    </div>
    <div class="control">
      <label>Spread <span class="val" id="v-spread">20</span></label>
      <input type="range" id="spread" min="4" max="50" step="1" value="20">
    </div>
  </div>

  <div class="group">
    <h2>Appearance</h2>
    <div class="control">
      <label>Opacity <span class="val" id="v-opacity">0.4</span></label>
      <input type="range" id="opacity" min="0.05" max="1" step="0.05" value="0.4">
    </div>
    <div class="control">
      <label>Line width <span class="val" id="v-lineWidth">1.5</span></label>
      <input type="range" id="lineWidth" min="0.5" max="4" step="0.25" value="1.5">
    </div>
    <div class="control">
      <label>Fade <span class="val" id="v-fade">0.7</span></label>
      <input type="range" id="fade" min="0" max="1" step="0.05" value="0.7">
    </div>
    <div class="control">
      <div class="color-row">
        <input type="color" id="waveColor" value="#5A7B7B">
        <span>Wave color</span>
      </div>
    </div>
    <div class="control">
      <div class="check-row">
        <input type="checkbox" id="foam" checked>
        <label for="foam">Foam dots</label>
      </div>
    </div>
    <div class="control">
      <label>Foam density <span class="val" id="v-foamDensity">0.3</span></label>
      <input type="range" id="foamDensity" min="0.05" max="1" step="0.05" value="0.3">
    </div>
  </div>

  <div class="group">
    <h2>Hex</h2>
    <div class="control">
      <label>Radius <span class="val" id="v-hexRadius">80</span></label>
      <input type="range" id="hexRadius" min="30" max="160" step="5" value="80">
    </div>
    <div class="control">
      <div class="check-row">
        <input type="checkbox" id="showFill" checked>
        <label for="showFill">City fill</label>
      </div>
    </div>
    <div class="control">
      <div class="check-row">
        <input type="checkbox" id="showLabel">
        <label for="showLabel">Show label</label>
      </div>
    </div>
  </div>
</div>

<div class="preview">
  <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
  <div class="prompt-bar">
    <div class="prompt-text" id="prompt"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
  </div>
</div>

<script>
const DEFAULTS = {
  layers: 3, amplitude: 8, frequency: 3, speed: 0.8, spread: 20,
  opacity: 0.4, lineWidth: 1.5, fade: 0.7, waveColor: '#5A7B7B',
  foam: true, foamDensity: 0.3, hexRadius: 80, showFill: true, showLabel: false
};

const PRESETS = {
  gentle:       { layers: 3, amplitude: 6,  frequency: 2.5, speed: 0.5, spread: 18, opacity: 0.3, lineWidth: 1,   fade: 0.8, waveColor: '#5A7B7B', foam: true,  foamDensity: 0.2 },
  cartographic: { layers: 4, amplitude: 4,  frequency: 5,   speed: 0.3, spread: 12, opacity: 0.5, lineWidth: 0.75,fade: 0.6, waveColor: '#6B8E8E', foam: false, foamDensity: 0.1 },
  stormy:       { layers: 5, amplitude: 16, frequency: 4,   speed: 2.0, spread: 30, opacity: 0.5, lineWidth: 2,   fade: 0.5, waveColor: '#4A6A6A', foam: true,  foamDensity: 0.7 },
  shallow:      { layers: 2, amplitude: 3,  frequency: 6,   speed: 1.0, spread: 8,  opacity: 0.25,lineWidth: 1,   fade: 0.9, waveColor: '#7A9B9B', foam: true,  foamDensity: 0.15 },
  deep:         { layers: 6, amplitude: 10, frequency: 2,   speed: 0.6, spread: 40, opacity: 0.35,lineWidth: 1.5, fade: 0.7, waveColor: '#3A5A5A', foam: true,  foamDensity: 0.5 },
};

const state = { ...DEFAULTS };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let time = 0;
let foamParticles = [];

// Bind controls
const controls = ['layers','amplitude','frequency','speed','spread','opacity','lineWidth','fade','foamDensity','hexRadius'];
controls.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    state[id] = parseFloat(el.value);
    document.getElementById('v-' + id).textContent = el.value;
    updatePrompt();
  });
});
['foam','showFill','showLabel'].forEach(id => {
  document.getElementById(id).addEventListener('change', (e) => {
    state[id] = e.target.checked;
    updatePrompt();
  });
});
document.getElementById('waveColor').addEventListener('input', (e) => {
  state.waveColor = e.target.value;
  updatePrompt();
});

function applyPreset(name) {
  const p = PRESETS[name];
  Object.assign(state, p);
  controls.forEach(id => {
    const el = document.getElementById(id);
    if (state[id] !== undefined) {
      el.value = state[id];
      document.getElementById('v-' + id).textContent = state[id];
    }
  });
  document.getElementById('foam').checked = state.foam;
  document.getElementById('waveColor').value = state.waveColor;
  updatePrompt();
}

function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 2; // pointy-top
    pts.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
  }
  return pts;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function hexPerimeterPoint(pts, t) {
  // t in [0,1] → point along hex perimeter
  const totalSides = 6;
  const idx = t * totalSides;
  const side = Math.floor(idx) % totalSides;
  const frac = idx - Math.floor(idx);
  const a = pts[side];
  const b = pts[(side + 1) % totalSides];
  return {
    x: lerp(a.x, b.x, frac),
    y: lerp(a.y, b.y, frac),
    // outward normal
    nx: -(b.y - a.y),
    ny: (b.x - a.x)
  };
}

function parseColor(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

function drawWaveLayer(cx, cy, pts, layerIdx) {
  const { amplitude, frequency, speed, spread, opacity, lineWidth, fade, waveColor, layers } = state;
  const offset = (layerIdx / layers) * spread + spread * 0.3;
  const layerFade = 1 - (layerIdx / layers) * fade;
  const col = parseColor(waveColor);

  const steps = 180;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const p = hexPerimeterPoint(pts, t);
    const nLen = Math.sqrt(p.nx * p.nx + p.ny * p.ny) || 1;
    const nx = p.nx / nLen;
    const ny = p.ny / nLen;

    // wave displacement along outward normal
    const wave = Math.sin(t * frequency * Math.PI * 2 + time * speed + layerIdx * 1.3)
               * amplitude * (0.5 + 0.5 * Math.sin(t * 2.7 + time * 0.3));
    const dist = offset + wave;

    const x = p.x + nx * dist;
    const y = p.y + ny * dist;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${opacity * layerFade})`;
  ctx.lineWidth = lineWidth * (1 - layerIdx * 0.1);
  ctx.stroke();
}

function spawnFoam(cx, cy, pts) {
  if (!state.foam) return;
  const { spread, foamDensity, layers } = state;
  // spawn a few particles per frame
  if (Math.random() < foamDensity * 0.5) {
    const t = Math.random();
    const p = hexPerimeterPoint(pts, t);
    const nLen = Math.sqrt(p.nx * p.nx + p.ny * p.ny);
    const nx = p.nx / nLen;
    const ny = p.ny / nLen;
    const dist = spread * 0.2 + Math.random() * spread * layers * 0.3;
    foamParticles.push({
      x: p.x + nx * dist,
      y: p.y + ny * dist,
      life: 1,
      decay: 0.005 + Math.random() * 0.015,
      size: 0.5 + Math.random() * 1.5
    });
  }
}

function drawFoam() {
  if (!state.foam) return;
  const col = parseColor(state.waveColor);
  foamParticles = foamParticles.filter(p => {
    p.life -= p.decay;
    if (p.life <= 0) return false;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${col.r},${col.g},${col.b},${p.life * state.opacity * 0.6})`;
    ctx.fill();
    return true;
  });
}

function render() {
  try {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w === 0 || h === 0) { requestAnimationFrame(render); return; }
  const bw = Math.round(w * dpr);
  const bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  ctx.resetTransform();
  ctx.scale(dpr, dpr);

  // Background — parchment
  ctx.fillStyle = '#C8B8A8';
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const pts = hexPoints(cx, cy, state.hexRadius);

  // Draw wave layers (outermost first)
  for (let i = state.layers - 1; i >= 0; i--) {
    drawWaveLayer(cx, cy, pts, i);
  }

  // Foam
  spawnFoam(cx, cy, pts);
  drawFoam();

  // Hex fill
  if (state.showFill) {
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = '#9A7B35';
    ctx.fill();
    ctx.strokeStyle = '#7A5B15';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else {
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.strokeStyle = '#7A5B15';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Label
  if (state.showLabel) {
    ctx.font = '13px "EB Garamond", Georgia, serif';
    ctx.fillStyle = '#2E2A26';
    ctx.textAlign = 'center';
    ctx.fillText('cineca-galileo', cx, cy + 4);
  }

  time += 0.016;
  } catch(e) { console.error('render error:', e); }
  requestAnimationFrame(render);
}

function updatePrompt() {
  const parts = [];
  const d = DEFAULTS;

  parts.push(`Add a coastline wave animation around remote city hexagons.`);

  if (state.layers !== d.layers) parts.push(`${state.layers} wave layers`);
  if (state.amplitude !== d.amplitude) parts.push(`amplitude ${state.amplitude}px`);
  if (state.frequency !== d.frequency) parts.push(`frequency ${state.frequency}`);
  if (state.speed !== d.speed) parts.push(`speed ${state.speed}`);
  if (state.spread !== d.spread) parts.push(`${state.spread}px spread between layers`);
  if (state.opacity !== d.opacity) parts.push(`opacity ${state.opacity}`);
  if (state.lineWidth !== d.lineWidth) parts.push(`line width ${state.lineWidth}`);
  if (state.fade !== d.fade) parts.push(`outer layer fade ${state.fade}`);
  if (state.waveColor !== d.waveColor) parts.push(`wave color ${state.waveColor}`);
  if (state.foam !== d.foam) parts.push(state.foam ? 'with foam dots' : 'no foam dots');
  if (state.foam && state.foamDensity !== d.foamDensity) parts.push(`foam density ${state.foamDensity}`);

  const prompt = parts[0] + (parts.length > 1 ? ' Parameters: ' + parts.slice(1).join(', ') + '.' : ' Use defaults: 3 layers, amplitude 8, frequency 3, speed 0.8, spread 20, opacity 0.4, teal #5A7B7B, with subtle foam dots.');

  document.getElementById('prompt').textContent = prompt;
}

function copyPrompt() {
  const text = document.getElementById('prompt').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

updatePrompt();
render();
</script>
</body>
</html>
