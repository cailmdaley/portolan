<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portolan Coastline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 1fr auto;
    }

    .controls {
      background: #242424;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 11px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 12px;
    }

    .control {
      margin-bottom: 14px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .control label span.value {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 11px;
      color: #888;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #8a7a5a;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #333;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .preset {
      padding: 6px 10px;
      font-size: 11px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset:hover {
      background: #3a3a3a;
      border-color: #555;
      color: #ddd;
    }

    .preset.active {
      background: #3a352a;
      border-color: #6a5a3a;
      color: #d4c4a8;
    }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 8px;
    }

    .btn:hover {
      background: #3a3a3a;
      color: #ddd;
    }

    .preview {
      background: #f5eee1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .prompt-output {
      grid-column: 1 / -1;
      background: #1e1e1e;
      border-top: 1px solid #333;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .prompt-text {
      flex: 1;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #aaa;
      white-space: pre-wrap;
    }

    .copy-btn {
      padding: 8px 16px;
      font-size: 12px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #3a3a3a;
      color: #ddd;
    }

    .copy-btn.copied {
      background: #2a3a2a;
      border-color: #4a6a4a;
      color: #8a8;
    }

    .seed-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .seed-btn {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #888;
      cursor: pointer;
    }

    .seed-btn:hover {
      background: #3a3a3a;
      color: #aaa;
    }

    .seed-display {
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      color: #8a7a5a;
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>Portolan Coastline</h1>
    <p class="subtitle">Procedural coastline generation using midpoint displacement</p>

    <div class="presets">
      <button class="preset active" data-preset="portolan">Portolan</button>
      <button class="preset" data-preset="rugged">Rugged</button>
      <button class="preset" data-preset="smooth">Smooth</button>
      <button class="preset" data-preset="fjords">Fjords</button>
      <button class="preset" data-preset="archipelago">Islands</button>
    </div>

    <div class="section">
      <div class="section-title">Seed</div>
      <div class="seed-display" id="seedDisplay">Seed: 42</div>
      <div class="seed-row">
        <button class="seed-btn" id="prevSeed">← Prev</button>
        <button class="seed-btn" id="randomSeed">Random</button>
        <button class="seed-btn" id="nextSeed">Next →</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Fractal Generation</div>

      <div class="control">
        <label>Iterations <span class="value" id="iterationsVal">7</span></label>
        <input type="range" id="iterations" min="3" max="10" step="1" value="7">
      </div>

      <div class="control">
        <label>Displacement <span class="value" id="displacementVal">0.15</span></label>
        <input type="range" id="displacement" min="0.02" max="0.4" step="0.01" value="0.15">
      </div>

      <div class="control">
        <label>Roughness <span class="value" id="roughnessVal">0.55</span></label>
        <input type="range" id="roughness" min="0.3" max="0.8" step="0.01" value="0.55">
      </div>

      <div class="control">
        <label>Bias (Land ↔ Sea) <span class="value" id="biasVal">0.00</span></label>
        <input type="range" id="bias" min="-0.5" max="0.5" step="0.01" value="0">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Base Shape</div>

      <div class="control">
        <label>Curvature <span class="value" id="curvatureVal">0.2</span></label>
        <input type="range" id="curvature" min="0" max="0.6" step="0.01" value="0.2">
      </div>

      <div class="control">
        <label>Base Points <span class="value" id="basePointsVal">3</span></label>
        <input type="range" id="basePoints" min="2" max="8" step="1" value="3">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Line Style</div>

      <div class="control">
        <label>Line Width <span class="value" id="lineWidthVal">1.5</span></label>
        <input type="range" id="lineWidth" min="0.5" max="4" step="0.1" value="1.5">
      </div>

      <div class="control">
        <label>Line Color</label>
        <input type="color" id="lineColor" value="#2a2420">
      </div>
    </div>

    <button class="btn" id="regenerate">Regenerate</button>
  </div>

  <div class="preview">
    <canvas id="canvas" width="960" height="700"></canvas>
  </div>

  <div class="prompt-output">
    <div class="prompt-text" id="promptText">Coastline with default portolan settings.</div>
    <button class="copy-btn" id="copyBtn">Copy</button>
  </div>

  <script>
    // Seeded random number generator (mulberry32)
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    let rng = mulberry32(42);

    // State
    const DEFAULTS = {
      seed: 42,
      iterations: 7,
      displacement: 0.15,
      roughness: 0.55,
      bias: 0,
      curvature: 0.2,
      basePoints: 3,
      lineWidth: 1.5,
      lineColor: '#2a2420'
    };

    const PRESETS = {
      portolan: { ...DEFAULTS },
      rugged: { ...DEFAULTS, iterations: 8, displacement: 0.22, roughness: 0.65, bias: 0.05 },
      smooth: { ...DEFAULTS, iterations: 6, displacement: 0.08, roughness: 0.45, curvature: 0.3 },
      fjords: { ...DEFAULTS, iterations: 9, displacement: 0.25, roughness: 0.70, bias: -0.15, basePoints: 4 },
      archipelago: { ...DEFAULTS, iterations: 6, displacement: 0.12, roughness: 0.5, curvature: 0.4, basePoints: 5 }
    };

    const state = { ...DEFAULTS };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Generate base curve points
    function generateBaseCurve(numPoints, curvature) {
      const points = [];
      const margin = 0.1;

      for (let i = 0; i < numPoints; i++) {
        const t = i / (numPoints - 1);
        const x = margin + t * (1 - 2 * margin);

        // Base Y follows a gentle curve
        const baseY = 0.5 + Math.sin(t * Math.PI) * curvature;

        // Add some structured variation
        const variation = Math.sin(t * Math.PI * 2) * curvature * 0.3;

        points.push({ x, y: baseY + variation });
      }

      return points;
    }

    // Midpoint displacement algorithm
    function midpointDisplacement(points, iterations, displacement, roughness, bias) {
      let current = [...points];

      for (let iter = 0; iter < iterations; iter++) {
        const next = [];

        for (let i = 0; i < current.length - 1; i++) {
          const p1 = current[i];
          const p2 = current[i + 1];

          // Add first point
          next.push(p1);

          // Calculate midpoint
          const midX = (p1.x + p2.x) / 2;
          const midY = (p1.y + p2.y) / 2;

          // Calculate perpendicular direction
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.sqrt(dx * dx + dy * dy);

          // Perpendicular unit vector (rotate 90°)
          const perpX = -dy / len;
          const perpY = dx / len;

          // Random displacement (with bias toward land or sea)
          const randDisp = (rng() - 0.5 + bias) * displacement * len * 2;

          next.push({
            x: midX + perpX * randDisp,
            y: midY + perpY * randDisp
          });
        }

        // Add last point
        next.push(current[current.length - 1]);

        current = next;
        displacement *= roughness; // Reduce displacement each iteration
      }

      return current;
    }

    // Draw coastline
    function drawCoastline(points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x * canvas.width, points[0].y * canvas.height);

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x * canvas.width, points[i].y * canvas.height);
      }

      ctx.strokeStyle = state.lineColor;
      ctx.lineWidth = state.lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Fill land area (above coastline)
    function fillLand(points) {
      ctx.beginPath();

      // Start from top-left
      ctx.moveTo(0, 0);

      // Go to first point
      ctx.lineTo(points[0].x * canvas.width, points[0].y * canvas.height);

      // Draw coastline
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x * canvas.width, points[i].y * canvas.height);
      }

      // Complete the land area
      ctx.lineTo(canvas.width, 0);
      ctx.closePath();

      // Very subtle land fill
      ctx.fillStyle = 'rgba(180, 160, 130, 0.08)';
      ctx.fill();
    }

    // Main render
    function render() {
      // Reset RNG with current seed
      rng = mulberry32(state.seed);

      // Clear with vellum color
      ctx.fillStyle = '#f5eee1';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Add subtle vellum variation (simple gradient)
      const gradient = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.5, 0,
        canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.7
      );
      gradient.addColorStop(0, 'rgba(248, 242, 230, 0.5)');
      gradient.addColorStop(1, 'rgba(218, 200, 172, 0.3)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Generate coastline
      const baseCurve = generateBaseCurve(state.basePoints, state.curvature);
      const coastline = midpointDisplacement(
        baseCurve,
        state.iterations,
        state.displacement,
        state.roughness,
        state.bias
      );

      // Draw
      fillLand(coastline);
      drawCoastline(coastline);
    }

    // Update prompt
    function updatePrompt() {
      const parts = [];

      if (state.seed !== DEFAULTS.seed) {
        parts.push(`seed ${state.seed}`);
      }

      if (state.iterations !== DEFAULTS.iterations) {
        const desc = state.iterations > DEFAULTS.iterations ? 'more detailed' : 'simpler';
        parts.push(`${desc} (${state.iterations} iterations)`);
      }

      if (Math.abs(state.displacement - DEFAULTS.displacement) > 0.02) {
        const desc = state.displacement > DEFAULTS.displacement ? 'more jagged' : 'gentler';
        parts.push(`${desc} displacement (${state.displacement.toFixed(2)})`);
      }

      if (Math.abs(state.roughness - DEFAULTS.roughness) > 0.03) {
        const desc = state.roughness > DEFAULTS.roughness ? 'rougher' : 'smoother';
        parts.push(`${desc} fractal decay (${state.roughness.toFixed(2)})`);
      }

      if (Math.abs(state.bias) > 0.05) {
        const desc = state.bias > 0 ? 'more bays' : 'more peninsulas';
        parts.push(`${desc} (bias ${state.bias.toFixed(2)})`);
      }

      let text;
      if (parts.length === 0) {
        text = 'Coastline with authentic portolan settings.';
      } else {
        text = `Coastline with ${parts.join(', ')}.`;
      }

      text += `\n\nParameters: seed=${state.seed}, iterations=${state.iterations}, displacement=${state.displacement}, roughness=${state.roughness}, bias=${state.bias}, curvature=${state.curvature}, basePoints=${state.basePoints}`;

      document.getElementById('promptText').textContent = text;
    }

    // Update all
    function updateAll() {
      document.getElementById('seedDisplay').textContent = `Seed: ${state.seed}`;
      document.getElementById('iterationsVal').textContent = state.iterations;
      document.getElementById('displacementVal').textContent = state.displacement.toFixed(2);
      document.getElementById('roughnessVal').textContent = state.roughness.toFixed(2);
      document.getElementById('biasVal').textContent = state.bias.toFixed(2);
      document.getElementById('curvatureVal').textContent = state.curvature.toFixed(2);
      document.getElementById('basePointsVal').textContent = state.basePoints;
      document.getElementById('lineWidthVal').textContent = state.lineWidth.toFixed(1);

      render();
      updatePrompt();
    }

    // Bind controls
    ['iterations', 'displacement', 'roughness', 'bias', 'curvature', 'basePoints', 'lineWidth'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        state[id] = parseFloat(e.target.value);
        updateAll();
      });
    });

    document.getElementById('lineColor').addEventListener('input', e => {
      state.lineColor = e.target.value;
      updateAll();
    });

    // Seed controls
    document.getElementById('prevSeed').addEventListener('click', () => {
      state.seed = Math.max(1, state.seed - 1);
      updateAll();
    });

    document.getElementById('nextSeed').addEventListener('click', () => {
      state.seed++;
      updateAll();
    });

    document.getElementById('randomSeed').addEventListener('click', () => {
      state.seed = Math.floor(Math.random() * 100000);
      updateAll();
    });

    document.getElementById('regenerate').addEventListener('click', () => {
      state.seed = Math.floor(Math.random() * 100000);
      updateAll();
    });

    // Presets
    document.querySelectorAll('.preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = PRESETS[btn.dataset.preset];
        Object.assign(state, preset);

        // Update control values
        document.getElementById('iterations').value = state.iterations;
        document.getElementById('displacement').value = state.displacement;
        document.getElementById('roughness').value = state.roughness;
        document.getElementById('bias').value = state.bias;
        document.getElementById('curvature').value = state.curvature;
        document.getElementById('basePoints').value = state.basePoints;
        document.getElementById('lineWidth').value = state.lineWidth;
        document.getElementById('lineColor').value = state.lineColor;

        document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        updateAll();
      });
    });

    // Copy button
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('promptText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1500);
      });
    });

    // Initial render
    updateAll();
  </script>
</body>
</html>
