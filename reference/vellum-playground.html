<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portolan Vellum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr auto;
    }

    /* Controls Panel */
    .controls {
      background: #242424;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 12px;
    }

    .control {
      margin-bottom: 14px;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .control label span.value {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 11px;
      color: #888;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #e8dcc8;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #333;
    }

    /* Presets */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .preset {
      padding: 6px 10px;
      font-size: 11px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset:hover {
      background: #3a3a3a;
      border-color: #555;
      color: #ddd;
    }

    .preset.active {
      background: #4a4035;
      border-color: #8a7a5a;
      color: #e8dcc8;
    }

    /* Preview */
    .preview {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    /* Prompt Output */
    .prompt-output {
      grid-column: 1 / -1;
      background: #1e1e1e;
      border-top: 1px solid #333;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .prompt-text {
      flex: 1;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #aaa;
      white-space: pre-wrap;
    }

    .copy-btn {
      padding: 8px 16px;
      font-size: 12px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #3a3a3a;
      color: #ddd;
    }

    .copy-btn.copied {
      background: #2a3a2a;
      border-color: #4a6a4a;
      color: #8a8;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>Portolan Vellum</h1>

    <div class="presets">
      <button class="preset active" data-preset="authentic">Authentic</button>
      <button class="preset" data-preset="warm">Warm</button>
      <button class="preset" data-preset="aged">Aged</button>
      <button class="preset" data-preset="pale">Pale</button>
      <button class="preset" data-preset="weathered">Weathered</button>
    </div>

    <div class="section">
      <div class="section-title">Base Color</div>

      <div class="control">
        <label>Center Color <span class="value" id="centerColorVal">#f5eee1</span></label>
        <input type="color" id="centerColor" value="#f5eee1">
      </div>

      <div class="control">
        <label>Warmth <span class="value" id="warmthVal">0.12</span></label>
        <input type="range" id="warmth" min="0" max="0.3" step="0.01" value="0.12">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Edge Effects</div>

      <div class="control">
        <label>Edge Darkening <span class="value" id="edgeDarkVal">0.25</span></label>
        <input type="range" id="edgeDark" min="0" max="0.5" step="0.01" value="0.25">
      </div>

      <div class="control">
        <label>Edge Softness <span class="value" id="edgeSoftVal">0.15</span></label>
        <input type="range" id="edgeSoft" min="0.05" max="0.4" step="0.01" value="0.15">
      </div>

      <div class="control">
        <label>Corner Patina <span class="value" id="cornerVal">0.10</span></label>
        <input type="range" id="corner" min="0" max="0.3" step="0.01" value="0.10">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Organic Variation</div>

      <div class="control">
        <label>Cloud Scale <span class="value" id="cloudScaleVal">3.0</span></label>
        <input type="range" id="cloudScale" min="1" max="8" step="0.1" value="3.0">
      </div>

      <div class="control">
        <label>Cloud Intensity <span class="value" id="cloudIntVal">0.12</span></label>
        <input type="range" id="cloudInt" min="0" max="0.3" step="0.01" value="0.12">
      </div>

      <div class="control">
        <label>Fine Grain <span class="value" id="grainVal">0.03</span></label>
        <input type="range" id="grain" min="0" max="0.1" step="0.005" value="0.03">
      </div>
    </div>
  </div>

  <div class="preview">
    <canvas id="canvas" width="960" height="600"></canvas>
  </div>

  <div class="prompt-output">
    <div class="prompt-text" id="promptText">Vellum shader with default settings.</div>
    <button class="copy-btn" id="copyBtn">Copy</button>
  </div>

  <script>
    // State
    const DEFAULTS = {
      centerColor: '#f5eee1',
      warmth: 0.12,
      edgeDark: 0.25,
      edgeSoft: 0.15,
      corner: 0.10,
      cloudScale: 3.0,
      cloudInt: 0.12,
      grain: 0.03
    };

    const PRESETS = {
      authentic: { ...DEFAULTS },
      warm: { centerColor: '#f8f0dc', warmth: 0.18, edgeDark: 0.22, edgeSoft: 0.18, corner: 0.08, cloudScale: 3.5, cloudInt: 0.10, grain: 0.025 },
      aged: { centerColor: '#e8dcc8', warmth: 0.15, edgeDark: 0.35, edgeSoft: 0.12, corner: 0.18, cloudScale: 2.5, cloudInt: 0.18, grain: 0.04 },
      pale: { centerColor: '#faf6f0', warmth: 0.06, edgeDark: 0.15, edgeSoft: 0.20, corner: 0.05, cloudScale: 4.0, cloudInt: 0.08, grain: 0.02 },
      weathered: { centerColor: '#e0d4c0', warmth: 0.20, edgeDark: 0.40, edgeSoft: 0.10, corner: 0.22, cloudScale: 2.0, cloudInt: 0.22, grain: 0.05 }
    };

    const state = { ...DEFAULTS };

    // Canvas & WebGL
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('webgl');

    // Shaders
    const vertexSource = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      varying vec2 v_uv;

      uniform vec3 u_centerColor;
      uniform float u_warmth;
      uniform float u_edgeDark;
      uniform float u_edgeSoft;
      uniform float u_corner;
      uniform float u_cloudScale;
      uniform float u_cloudInt;
      uniform float u_grain;
      uniform float u_time;

      // Simplex-ish noise
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                           -0.577350269189626, 0.024390243902439);
        vec2 i  = floor(v + dot(v, C.yy));
        vec2 x0 = v -   i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                                + i.x + vec3(0.0, i1.x, 1.0));
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                                dot(x12.zw,x12.zw)), 0.0);
        m = m*m; m = m*m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
        vec3 g;
        g.x = a0.x * x0.x + h.x * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }

      // FBM (fractal brownian motion)
      float fbm(vec2 p, float scale) {
        float f = 0.0;
        float amp = 0.5;
        vec2 pp = p * scale;
        for (int i = 0; i < 4; i++) {
          f += amp * snoise(pp);
          pp *= 2.0;
          amp *= 0.5;
        }
        return f;
      }

      // Hash for grain
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        vec2 uv = v_uv;

        // Aspect ratio correction for noise
        vec2 aspect = vec2(1.6, 1.0);

        // Cloud variation (organic, flowing)
        float cloud = fbm(uv * aspect, u_cloudScale) * 0.5 + 0.5;
        float warmCloud = fbm(uv * aspect + 10.0, u_cloudScale * 0.7) * 0.5 + 0.5;

        // Edge darkening (rectangular, organic wobble)
        vec2 edgeDist = min(uv, 1.0 - uv);
        float edge = min(edgeDist.x, edgeDist.y);

        // Add organic wobble to edge
        float wobble = snoise(uv * 8.0) * 0.02;
        edge += wobble;

        float edgeFade = smoothstep(0.0, u_edgeSoft, edge);
        float edgeEffect = (1.0 - edgeFade) * u_edgeDark;

        // Corner patina
        float cornerDist = min(
          min(length(uv), length(uv - vec2(1.0, 0.0))),
          min(length(uv - vec2(0.0, 1.0)), length(uv - vec2(1.0, 1.0)))
        );
        float cornerEffect = exp(-cornerDist * 4.0) * u_corner;

        // Fine grain
        float grain = (hash(uv * 1000.0) - 0.5) * u_grain;

        // Combine into darkness value
        float darkness =
          cloud * u_cloudInt +
          warmCloud * u_warmth +
          edgeEffect +
          cornerEffect +
          grain;

        // Color gradient
        // Edge color: warmer/beige, not gray
        vec3 edgeColor = u_centerColor * vec3(0.85, 0.80, 0.72);
        vec3 color = mix(u_centerColor, edgeColor, darkness);

        // Warmth shift in darker areas (beige, not gray)
        color.r += darkness * 0.03;
        color.g += darkness * 0.015;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // Compile shader
    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    // Create program
    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
    }

    // Set up geometry (full-screen quad)
    const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    // Get uniform locations
    const uniforms = {
      centerColor: gl.getUniformLocation(program, 'u_centerColor'),
      warmth: gl.getUniformLocation(program, 'u_warmth'),
      edgeDark: gl.getUniformLocation(program, 'u_edgeDark'),
      edgeSoft: gl.getUniformLocation(program, 'u_edgeSoft'),
      corner: gl.getUniformLocation(program, 'u_corner'),
      cloudScale: gl.getUniformLocation(program, 'u_cloudScale'),
      cloudInt: gl.getUniformLocation(program, 'u_cloudInt'),
      grain: gl.getUniformLocation(program, 'u_grain'),
      time: gl.getUniformLocation(program, 'u_time')
    };

    // Hex to RGB
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      return [r, g, b];
    }

    // Render
    function render() {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(program);

      const rgb = hexToRgb(state.centerColor);
      gl.uniform3f(uniforms.centerColor, rgb[0], rgb[1], rgb[2]);
      gl.uniform1f(uniforms.warmth, state.warmth);
      gl.uniform1f(uniforms.edgeDark, state.edgeDark);
      gl.uniform1f(uniforms.edgeSoft, state.edgeSoft);
      gl.uniform1f(uniforms.corner, state.corner);
      gl.uniform1f(uniforms.cloudScale, state.cloudScale);
      gl.uniform1f(uniforms.cloudInt, state.cloudInt);
      gl.uniform1f(uniforms.grain, state.grain);
      gl.uniform1f(uniforms.time, performance.now() * 0.001);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    // Update prompt
    function updatePrompt() {
      const parts = [];

      if (state.centerColor !== DEFAULTS.centerColor) {
        parts.push(`base color ${state.centerColor}`);
      }

      if (Math.abs(state.warmth - DEFAULTS.warmth) > 0.02) {
        const desc = state.warmth > DEFAULTS.warmth ? 'warmer' : 'cooler';
        parts.push(`${desc} tone (${state.warmth.toFixed(2)})`);
      }

      if (Math.abs(state.edgeDark - DEFAULTS.edgeDark) > 0.03) {
        const desc = state.edgeDark > DEFAULTS.edgeDark ? 'more pronounced' : 'subtle';
        parts.push(`${desc} edge darkening (${state.edgeDark.toFixed(2)})`);
      }

      if (Math.abs(state.corner - DEFAULTS.corner) > 0.02) {
        const desc = state.corner > DEFAULTS.corner ? 'heavier' : 'lighter';
        parts.push(`${desc} corner patina (${state.corner.toFixed(2)})`);
      }

      if (Math.abs(state.cloudScale - DEFAULTS.cloudScale) > 0.3) {
        const desc = state.cloudScale > DEFAULTS.cloudScale ? 'finer' : 'broader';
        parts.push(`${desc} organic variation (scale ${state.cloudScale.toFixed(1)})`);
      }

      if (Math.abs(state.cloudInt - DEFAULTS.cloudInt) > 0.02) {
        const desc = state.cloudInt > DEFAULTS.cloudInt ? 'more' : 'less';
        parts.push(`${desc} cloud variation (${state.cloudInt.toFixed(2)})`);
      }

      if (Math.abs(state.grain - DEFAULTS.grain) > 0.01) {
        const desc = state.grain > DEFAULTS.grain ? 'coarser' : 'finer';
        parts.push(`${desc} grain texture (${state.grain.toFixed(3)})`);
      }

      let text;
      if (parts.length === 0) {
        text = 'Vellum shader with authentic portolan defaults.';
      } else {
        text = `Vellum shader with ${parts.join(', ')}.`;
      }

      // Add shader values for implementation
      text += `\n\nShader uniforms: centerColor=${state.centerColor}, warmth=${state.warmth}, edgeDark=${state.edgeDark}, edgeSoft=${state.edgeSoft}, corner=${state.corner}, cloudScale=${state.cloudScale}, cloudInt=${state.cloudInt}, grain=${state.grain}`;

      document.getElementById('promptText').textContent = text;
    }

    // Update all
    function updateAll() {
      // Update value displays
      document.getElementById('centerColorVal').textContent = state.centerColor;
      document.getElementById('warmthVal').textContent = state.warmth.toFixed(2);
      document.getElementById('edgeDarkVal').textContent = state.edgeDark.toFixed(2);
      document.getElementById('edgeSoftVal').textContent = state.edgeSoft.toFixed(2);
      document.getElementById('cornerVal').textContent = state.corner.toFixed(2);
      document.getElementById('cloudScaleVal').textContent = state.cloudScale.toFixed(1);
      document.getElementById('cloudIntVal').textContent = state.cloudInt.toFixed(2);
      document.getElementById('grainVal').textContent = state.grain.toFixed(3);

      render();
      updatePrompt();
    }

    // Bind controls
    document.getElementById('centerColor').addEventListener('input', e => {
      state.centerColor = e.target.value;
      updateAll();
    });

    ['warmth', 'edgeDark', 'edgeSoft', 'corner', 'cloudScale', 'cloudInt', 'grain'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        state[id] = parseFloat(e.target.value);
        updateAll();
      });
    });

    // Presets
    document.querySelectorAll('.preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = PRESETS[btn.dataset.preset];
        Object.assign(state, preset);

        // Update control values
        document.getElementById('centerColor').value = state.centerColor;
        document.getElementById('warmth').value = state.warmth;
        document.getElementById('edgeDark').value = state.edgeDark;
        document.getElementById('edgeSoft').value = state.edgeSoft;
        document.getElementById('corner').value = state.corner;
        document.getElementById('cloudScale').value = state.cloudScale;
        document.getElementById('cloudInt').value = state.cloudInt;
        document.getElementById('grain').value = state.grain;

        // Update active state
        document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        updateAll();
      });
    });

    // Copy button
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('promptText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1500);
      });
    });

    // Initial render
    updateAll();
  </script>
</body>
</html>
